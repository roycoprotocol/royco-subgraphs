# prettier-ignore
# =============================================================================
# Source template for subgraph.yaml.
#
# EDIT THIS FILE — never subgraph.yaml, which is rendered from this by
#   npm run prepare:markets:<network>
# and is gitignored. A hand-edit to subgraph.yaml appears to work, builds, and
# indexes — right up until the next prepare silently reverts it. See CLAUDE.md §2.
#
# One template serves every network: mustache fills {{network}},
# {{roycoFactoryContractAddress}} and {{roycoFactoryStartBlock}} from
# config/markets/networks/<network>.json. (royco-rwa keeps a near-duplicate
# template per network; there's no need — the values are the only difference.)
#
# Event signatures here are NOT hand-written. They are copied from
# tests/generated/abi-signatures.ts, which derives them from abis/*.json using
# graph-cli's own algorithm. A wrong signature yields a topic0 that matches
# nothing: zero rows, zero errors. Ask the abi-oracle subagent, or read the
# generated file — never transcribe tuple components by eye.
# =============================================================================
specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: RoycoFactory
    network: {{network}}
    source:
      address: "{{roycoFactoryContractAddress}}"
      abi: RoycoFactory
      startBlock: {{roycoFactoryStartBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DayMarketState
        - DayVaultState
        - DayVaultStateHistorical
        # The market's 18-column price vector, seeded at entry 0 from the three vaults
        # this same handler writes — no extra eth_calls (§ the note in schema.graphql).
        - DayMarketNav
        - DayMarketNavHistorical
      abis:
        - name: RoycoFactory
          file: ./abis/RoycoFactory.json
        - name: RoycoDayKernel
          file: ./abis/RoycoDayKernel.json
        - name: RoycoDayAccountant
          file: ./abis/RoycoDayAccountant.json
        - name: RoycoSeniorTranche
          file: ./abis/RoycoSeniorTranche.json
        - name: RoycoJuniorTranche
          file: ./abis/RoycoJuniorTranche.json
        - name: RoycoLiquidityProviderTranche
          file: ./abis/RoycoLiquidityProviderTranche.json
        - name: ERC20
          file: ./abis/ERC20.json
        # The Balancer V3 vault + pool token, for the QUOTE ASSET's NAV price. The
        # liquidity tranche's deposit asset IS the BPT, and that pool is a pair of
        # (senior tranche share, quote asset) — enforced in the venue constructor. The
        # quote leg's NAV price per whole token is exactly its registered pool token
        # rate, so refreshMarketNav reads getPoolTokenRates on the vault. Both must be
        # listed HERE, on every data source that can reach that call, for the same
        # §10.4 reason as RoycoSeniorTranche above.
        - name: BalancerV3Vault
          file: ./abis/BalancerV3Vault.json
        - name: BalancerPoolToken
          file: ./abis/BalancerPoolToken.json
      eventHandlers:
        - event: MarketDeploymentCompleted(indexed address,indexed address,(address,address,address,address,address,address,address,bytes))
          handler: handleMarketDeploymentCompleted
          receipt: true
      file: ./src/royco-factory.ts
templates:
  # ---------------------------------------------------------------------------
  # The three tranches are separate contracts with separate ABIs, so each needs
  # its own template even where the event shapes are identical (Transfer,
  # Deposit, Redeem, ProtocolFeeSharesMinted). codegen emits a distinct class per
  # template, so shared handler logic is written once in src/handlers/ and
  # re-exported from each entry file. See CLAUDE.md §10.
  # ---------------------------------------------------------------------------
  - kind: ethereum/contract
    name: RoycoSeniorTranche
    network: {{network}}
    source:
      abi: RoycoSeniorTranche
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DayMarketState
        - DayVaultState
        - DayVaultStateHistorical
        - DayPositionState
        - DayPositionStateHistorical
        - DayFeeState
        - DayFeeStateHistorical
        # Senior-only: only the senior tranche emits LiquidityPremiumSharesMinted.
        - DayLiquidityPremiumSharesMintedHistory
        - GlobalTokenTransfer
        - GlobalTokenActivity
      abis:
        - name: RoycoSeniorTranche
          file: ./abis/RoycoSeniorTranche.json
        - name: RoycoDayKernel
          file: ./abis/RoycoDayKernel.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
          receipt: true
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
          receipt: true
        - event: Redeem(indexed address,indexed address,(uint256,uint256,uint256,uint256),uint256)
          handler: handleRedeem
          receipt: true
        - event: ProtocolFeeSharesMinted(indexed address,uint256,uint256)
          handler: handleProtocolFeeSharesMinted
          receipt: true
        # Senior-only: Junior and Liquidity do not emit this.
        - event: LiquidityPremiumSharesMinted(indexed address,uint256,uint256)
          handler: handleLiquidityPremiumSharesMinted
          receipt: true
      file: ./src/royco-senior-tranche.ts
  - kind: ethereum/contract
    name: RoycoJuniorTranche
    network: {{network}}
    source:
      abi: RoycoJuniorTranche
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DayMarketState
        - DayVaultState
        - DayVaultStateHistorical
        - DayPositionState
        - DayPositionStateHistorical
        - DayFeeState
        - DayFeeStateHistorical
        - GlobalTokenTransfer
        - GlobalTokenActivity
      abis:
        - name: RoycoJuniorTranche
          file: ./abis/RoycoJuniorTranche.json
        # RoycoSeniorTranche is listed even though this is the Junior template, and it is
        # NOT redundant. src/handlers/ shares ONE implementation of Transfer/Deposit/
        # Redeem across all three tranches and binds RoycoSeniorTranche for its
        # convertToAssets calls — the three ABIs are byte-identical, guarded by
        # scripts/checks/abi.test.mjs. `bind()` bakes the contract NAME, and graph-node
        # resolves that name against THIS data source's abis: list at eth_call time; the
        # import path means nothing to it. Without this entry every Junior Transfer fails
        # its eth_call and stalls the subgraph — and `graph build` passes either way.
        # See CLAUDE.md §10.4.
        - name: RoycoSeniorTranche
          file: ./abis/RoycoSeniorTranche.json
        - name: RoycoDayKernel
          file: ./abis/RoycoDayKernel.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
          receipt: true
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
          receipt: true
        - event: Redeem(indexed address,indexed address,(uint256,uint256,uint256,uint256),uint256)
          handler: handleRedeem
          receipt: true
        - event: ProtocolFeeSharesMinted(indexed address,uint256,uint256)
          handler: handleProtocolFeeSharesMinted
          receipt: true
      file: ./src/royco-junior-tranche.ts
  - kind: ethereum/contract
    name: RoycoLiquidityProviderTranche
    network: {{network}}
    source:
      abi: RoycoLiquidityProviderTranche
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DayMarketState
        - DayVaultState
        - DayVaultStateHistorical
        - DayPositionState
        - DayPositionStateHistorical
        - DayFeeState
        - DayFeeStateHistorical
        # Liquidity-only: only the liquidity tranche emits MultiAssetDeposit/Redeem.
        - DayMultiAssetDepositActivity
        - DayMultiAssetRedeemActivity
        - GlobalTokenTransfer
        - GlobalTokenActivity
      abis:
        - name: RoycoLiquidityProviderTranche
          file: ./abis/RoycoLiquidityProviderTranche.json
        # RoycoSeniorTranche is listed even though this is the Liquidity template, and it is
        # NOT redundant. src/handlers/ shares ONE implementation of Transfer/Deposit/
        # Redeem across all three tranches and binds RoycoSeniorTranche for its
        # convertToAssets calls — the three ABIs are byte-identical, guarded by
        # scripts/checks/abi.test.mjs. `bind()` bakes the contract NAME, and graph-node
        # resolves that name against THIS data source's abis: list at eth_call time; the
        # import path means nothing to it. Without this entry every Liquidity Transfer fails
        # its eth_call and stalls the subgraph — and `graph build` passes either way.
        # See CLAUDE.md §10.4.
        - name: RoycoSeniorTranche
          file: ./abis/RoycoSeniorTranche.json
        - name: RoycoDayKernel
          file: ./abis/RoycoDayKernel.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
          receipt: true
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
          receipt: true
        - event: Redeem(indexed address,indexed address,(uint256,uint256,uint256,uint256),uint256)
          handler: handleRedeem
          receipt: true
        - event: ProtocolFeeSharesMinted(indexed address,uint256,uint256)
          handler: handleProtocolFeeSharesMinted
          receipt: true
        # Liquidity-only. Prefer these events over calling the multi-asset
        # previews: they carry the same numbers for free, as the exact post-state
        # at this log index. (The previews ARE callable — nonpayable functions do
        # get bindings, contrary to popular belief — but they're not pure reads.
        # See CLAUDE.md §5.)
        - event: MultiAssetDeposit(indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handleMultiAssetDeposit
          receipt: true
        - event: MultiAssetRedeem(indexed address,indexed address,indexed address,uint256,(uint256,uint256,uint256,uint256),uint256)
          handler: handleMultiAssetRedeem
          receipt: true
      file: ./src/royco-liquidity-tranche.ts
  - kind: ethereum/contract
    name: RoycoDayAccountant
    network: {{network}}
    source:
      abi: RoycoDayAccountant
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DayMarketState
        # handleFixedTermCommenced creates these and handleFixedTermEnded /
        # handleFixedTermDurationUpdated(0) close them (§10.3).
        - DayFixedTermHistory
        # handleYieldSharesAccrued appends this + advances BOTH
        # DayMarketState.timeWeighted*YieldShareAccruedWAD fields (§10.3).
        - DayYieldSharesAccruedHistory
      abis:
        - name: RoycoDayAccountant
          file: ./abis/RoycoDayAccountant.json
        - name: RoycoDayKernel
          file: ./abis/RoycoDayKernel.json
      eventHandlers:
        - event: MaxYieldSharesUpdated(uint64,uint64)
          handler: handleMaxYieldSharesUpdated
          receipt: true
        - event: FixedTermCommenced(uint32)
          handler: handleFixedTermCommenced
          receipt: true
        - event: FixedTermEnded()
          handler: handleFixedTermEnded
          receipt: true
        # The ONLY witness to the JT coverage impermanent loss that a term end
        # erases: the Accountant copies it into a local and zeroes storage BEFORE
        # marshalling state, so by the time FixedTermEnded fires both the preview
        # and getState() already read 0. Fills
        # DayFixedTermHistory.juniorTrancheCoverageImpermanentLossNAV, which is
        # permanently 0 without this.
        - event: JuniorTrancheImpermanentLossReset(uint256)
          handler: handleJuniorTrancheImpermanentLossReset
          receipt: true
        - event: FixedTermDurationUpdated(uint24)
          handler: handleFixedTermDurationUpdated
          receipt: true
        - event: CoverageUpdated(uint64)
          handler: handleCoverageUpdated
          receipt: true
        - event: LiquidityUpdated(uint64)
          handler: handleLiquidityUpdated
          receipt: true
        - event: LiquidationCoverageUtilizationUpdated(uint256)
          handler: handleLiquidationCoverageUtilizationUpdated
          receipt: true
        - event: SeniorTrancheProtocolFeeUpdated(uint64)
          handler: handleSeniorTrancheProtocolFeeUpdated
          receipt: true
        - event: JuniorTrancheProtocolFeeUpdated(uint64)
          handler: handleJuniorTrancheProtocolFeeUpdated
          receipt: true
        - event: JuniorTrancheYieldShareProtocolFeeUpdated(uint64)
          handler: handleJuniorTrancheYieldShareProtocolFeeUpdated
          receipt: true
        - event: LiquidityProviderTrancheYieldShareProtocolFeeUpdated(uint64)
          handler: handleLiquidityTrancheYieldShareProtocolFeeUpdated
          receipt: true
        # MERGED in v2: senior and junior share one collateral asset, so one tolerance
        # and one event. This also retires v1's effectiveNAVDustTolerance, which had no
        # event of its own and had to be recomputed inside both handlers.
        - event: DustToleranceUpdated(uint256)
          handler: handleDustToleranceUpdated
          receipt: true
        - event: JuniorTrancheYDMUpdated(address)
          handler: handleJuniorTrancheYDMUpdated
          receipt: true
        - event: LiquidityProviderTrancheYDMUpdated(address)
          handler: handleLiquidityTrancheYDMUpdated
          receipt: true
        # MERGED in v2: one event carries the JT and LPT accruals together, so one
        # handler and one DayYieldSharesAccruedHistory row replace v1's two of each.
        - event: YieldSharesAccrued(uint256,uint256,uint256,uint256)
          handler: handleYieldSharesAccrued
          receipt: true
      file: ./src/royco-day-accountant.ts
  - kind: ethereum/contract
    name: RoycoDayKernel
    network: {{network}}
    source:
      abi: RoycoDayKernel
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DayMarketState
        # handleLiquidityPremiumReinvested / handleLiquidityPremiumReinvestmentFailed
        # append these record streams (§10.3).
        - DayLiquidityPremiumReinvestedHistory
        - DayLiquidityPremiumReinvestmentFailedHistory
        # Both sync events collapse into ONE row per (market, block) here, and also
        # re-price the market's NAV vector via refreshMarketNav (§10.3).
        - DayTrancheAccountingSyncedHistory
        - DayMarketNav
        - DayMarketNavHistorical
        # READ, never written: refreshMarketNav loads all three vaults for their
        # decimals and minorType, and refreshMarketStoredState writes only
        # DayMarketState. Declared so this list names every entity the data source
        # touches, matching how the tranche templates are declared.
        - DayVaultState
      abis:
        - name: RoycoDayKernel
          file: ./abis/RoycoDayKernel.json
        # RoycoSeniorTranche is listed on the KERNEL template and it is NOT a
        # copy-paste slip. refreshMarketNav calls convertToAssets on all three tranches
        # through the one RoycoSeniorTranche class (their ABIs are byte-identical,
        # guarded by scripts/checks/abi.test.mjs). `bind()` bakes the contract NAME, and
        # graph-node resolves that name against THIS data source's abis: list at
        # eth_call time — the import path is irrelevant to it. Without this entry every
        # sync fails its call and stalls the subgraph, and `graph build` passes either
        # way. See CLAUDE.md §10.4. (It moved here from the accountant template in v2,
        # when the sync events moved onto the kernel.)
        - name: RoycoSeniorTranche
          file: ./abis/RoycoSeniorTranche.json
        # The Balancer V3 vault + pool token, for the QUOTE ASSET's NAV price. The
        # liquidity tranche's deposit asset IS the BPT, and that pool is a pair of
        # (senior tranche share, quote asset) — enforced in the venue constructor. The
        # quote leg's NAV price per whole token is exactly its registered pool token
        # rate, so refreshMarketNav reads getPoolTokenRates on the vault. Both must be
        # listed HERE, on every data source that can reach that call, for the same
        # §10.4 reason as RoycoSeniorTranche above.
        - name: BalancerV3Vault
          file: ./abis/BalancerV3Vault.json
        - name: BalancerPoolToken
          file: ./abis/BalancerPoolToken.json
        # The ACCOUNTANT, on the KERNEL template. Also not a slip: refreshMarketStoredState
        # re-reads Accountant.getState() on every sync for the two premium/accrual
        # checkpoints, which no event carries. §10.4 again — bind() bakes the contract
        # NAME and graph-node resolves it against THIS data source's abis: list, so
        # without this entry every sync fails its call and stalls the subgraph, and
        # `graph build` passes either way.
        - name: RoycoDayAccountant
          file: ./abis/RoycoDayAccountant.json
      eventHandlers:
        # BOTH sync events, collapsing into one row per (market, block): pre-op creates
        # it, post-op overwrites it. Pre-op fires on EVERY sync (swap hook, oracle
        # updates, syncTrancheAccounting, reinvest, and the first half of each
        # operation); post-op only on the eight deposit/redeem operations.
        # event.address is the KERNEL, so these resolve the market with no eth_call.
        - event: PreOpTrancheAccountingSynced((uint8,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint32,uint256,uint256,uint256))
          handler: handlePreOpTrancheAccountingSynced
          receipt: true
        - event: PostOpTrancheAccountingSynced(uint8,(uint8,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint32,uint256,uint256,uint256))
          handler: handlePostOpTrancheAccountingSynced
          receipt: true
        - event: ProtocolFeeRecipientUpdated(address)
          handler: handleProtocolFeeRecipientUpdated
          receipt: true
        - event: SeniorTrancheSelfLiquidationBonusUpdated(uint64)
          handler: handleSeniorTrancheSelfLiquidationBonusUpdated
          receipt: true
        - event: LiquidityPremiumReinvested(uint256,uint256)
          handler: handleLiquidityPremiumReinvested
          receipt: true
        - event: LiquidityPremiumReinvestmentFailed(uint256,uint256,bytes)
          handler: handleLiquidityPremiumReinvestmentFailed
          receipt: true
        # New in v2 — the kernel's oracle / sequencer-uptime configuration.
        - event: CollateralAssetOracleUpdated(indexed address,uint48)
          handler: handleCollateralAssetOracleUpdated
          receipt: true
        - event: BPTOracleUpdated(indexed address)
          handler: handleBPTOracleUpdated
          receipt: true
        - event: MaxReinvestmentSlippageUpdated(uint64)
          handler: handleMaxReinvestmentSlippageUpdated
          receipt: true
        - event: RoycoBlacklistUpdated(address)
          handler: handleRoycoBlacklistUpdated
          receipt: true
        - event: Paused(address)
          handler: handlePaused
          receipt: true
        - event: Unpaused(address)
          handler: handleUnpaused
          receipt: true
        - event: SequencerUptimeFeedUpdated(indexed address,uint48)
          handler: handleSequencerUptimeFeedUpdated
          receipt: true
      file: ./src/royco-day-kernel.ts
