# =============================================================================
# royco-day schema
#
# Ported from day-draft/day.schema.graphql. Field names are preserved from the
# draft; where a name differs from the ABI member it is read from, the field
# carries a "<- ABI:" annotation so handler authors never have to guess. The
# full mapping table lives in CLAUDE.md §7.
#
# Entity + field names become Postgres table + column names (snake_case) via the
# Goldsky pipeline. A rename here is a column migration in Neon. See CLAUDE.md §9.
# =============================================================================

# === GLOBAL ===
#
# !! FROZEN CROSS-PACKAGE CONTRACT — DO NOT CHANGE THESE TWO ENTITIES !!
#
# GlobalTokenTransfer and GlobalTokenActivity are byte-identical to the same
# entities in royco-rwa/schema.graphql. That is deliberate: royco-rwa (5
# pipelines), royco-usd, and staked-royco-usd ALL sink these entities into the
# SAME shared Neon tables — public.global_token_transfer and
# public.global_token_activity, secret NEON_ROYCO_ESTATE. royco-day joins that
# union.
#
# Rows do not collide (ids are chain + tx + log scoped), but the column set is
# now a contract shared with those packages. Adding, removing, or renaming a
# field here breaks their pipelines, not just ours. Before touching either
# entity, diff against royco-rwa/schema.graphql and coordinate the change across
# every package listed above.

type GlobalTokenTransfer @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<TRANSACTION_HASH>_<LOG_INDEX>_<TOKEN_INDEX>
  # ^ The trailing TOKEN_INDEX is NOT decoration: one Redeem log pays out up to
  #   three different asset ERC20s (the AssetClaims quintuple), and this entity is
  #   immutable — a second row on the same id is fatal at index time. Single-token
  #   logs use TOKEN_INDEX_SINGLE (0). This entity has no tokenIndex COLUMN (the
  #   field set is frozen, see the banner above); GlobalTokenActivity does, and is
  #   where you query the leg. See generateGlobalTokenTransferId for the
  #   cross-package caveat — royco-rwa writes a different shape into this same
  #   column, so never parse this id positionally.
  vaultId: String! # Vault ID
  chainId: BigInt! # Chain ID
  vaultAddress: String! # Vault Address
  category: String! # Category ("shares", "assets")
  subCategory: String! # Sub Category ("mint", "burn", "transferIn", "transferOut", "deposit", "withdraw")
  tokenId: String! # Token ID
  # ^ TWO SHAPES IN THIS COLUMN, for royco-day rows, and you must branch on `category`
  #   before parsing it:
  #     category == "assets"  -> <CHAIN_ID>_<TOKEN_ADDRESS>_<MARKET_ID>_<ROLE>, matching
  #                              DayMarketState.collateralTokenId /
  #                              liquidityTrancheAssetTokenId exactly
  #     category == "shares"  -> <CHAIN_ID>_<TOKEN_ADDRESS>, chain-global
  #   A share token has no role among {collateralAsset, lptAsset, quoteAsset} — it IS the
  #   vault — so only the asset rows can be tagged. See marketAssetTokenId.
  #
  #   !! AND IT DIVERGES FROM THE OTHER PACKAGES sharing this table. royco-rwa, royco-usd
  #      and staked-royco-usd all write the chain-global form into this same column. Rows
  #      cannot collide (ids are chain+tx+log scoped), but a consumer joining token_id to
  #      a chain-global token dimension will MISS royco-day's asset rows rather than
  #      error. Join on `tokenAddress` — unchanged, present on every row in every
  #      package — or strip the trailing <MARKET_ID>_<ROLE> first. This is the same class
  #      of cross-package divergence already documented on generateGlobalTokenTransferId,
  #      and the same rule applies: do NOT parse this column positionally.
  tokenAddress: String! # Token Address
  fromAddress: String! # From Address
  toAddress: String! # To Address
  value: BigInt! # Value
  blockNumber: BigInt! # Block Number
  blockTimestamp: BigInt! # Block Timestamp
  transactionHash: String! # Transaction Hash
  logIndex: BigInt! # Log Index
  createdAt: BigInt! # Created At
}

type GlobalTokenActivity @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<TRANSACTION_HASH>_<LOG_INDEX>_<VAULT_ADDRESS>_<CATEGORY>_<SUB_CATEGORY>_<TOKEN_INDEX>
  vaultId: String! # Vault ID
  chainId: BigInt! # Chain ID
  vaultAddress: String! # Vault Address
  category: String! # Category ("shares", "assets")
  subCategory: String! # Sub Category ("mint", "burn", "transferIn", "transferOut", "deposit", "withdraw")
  accountAddress: String! # Account Address
  type: String! # Type ("transfer")
  tokenIndex: BigInt! # Token Index
  tokenId: String! # Token ID
  tokenAddress: String! # Token Address
  value: BigInt! # Value
  status: String! # Status ("completed")
  blockNumber: BigInt! # Block Number
  blockTimestamp: BigInt! # Block Timestamp
  transactionHash: String! # Transaction hash
  logIndex: BigInt! # Log Index
  createdAt: BigInt! # Created At
}

# xxx GLOBAL xxx

# === MARKETS ===

type DayMarketState @entity(immutable: false) {
  # ======
  # => data from "event MarketDeploymentCompleted" in "RoycoFactory" (abis/RoycoFactory.json)
  #    Signature (all 8 tuple components, in order):
  #    MarketDeploymentCompleted(indexed address,indexed address,(address,address,address,address,address,address,address,bytes))
  id: String! # <CHAIN_ID>_<MARKET_ID> where "marketId" is "kernelAddress"
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID (is "kernelAddress")
  templateAddress: String! # Template Address
  deployerAddress: String! # Deployer Address
  seniorTrancheAddress: String! # Senior Tranche Address
  juniorTrancheAddress: String! # Junior Tranche Address
  liquidityTrancheAddress: String! # Liquidity Tranche Address <- ABI: result.liquidityProviderTranche
  seniorTrancheId: String! # Senior Tranche ID: <CHAIN_ID>_<SENIOR_TRANCHE_ADDRESS>
  juniorTrancheId: String! # Junior Tranche ID: <CHAIN_ID>_<JUNIOR_TRANCHE_ADDRESS>
  liquidityTrancheId: String! # Liquidity Tranche ID: <CHAIN_ID>_<LIQUIDITY_TRANCHE_ADDRESS>
  kernelAddress: String! # Kernel Address
  accountantAddress: String! # Accountant Address
  juniorTrancheYdmAddress: String! # Junior Tranche YDM Address <- ABI: result.ydm (NOT result.lptYdm)
  liquidityTrancheYdmAddress: String! # Liquidity Tranche YDM Address <- ABI: result.lptYdm
  creationEncodedData: String! # Creation Encoded Data (bytes of "extras" in event, stored as hex string)
  #
  # !! SCHEMA-vs-CONTRACT VOCABULARY. The v2 contracts renamed the liquidity tranche to
  #    the LIQUIDITY PROVIDER tranche (`lpt*`, `IRoycoLiquidityProviderTranche`,
  #    `TrancheType.LIQUIDITY_PROVIDER`). These columns deliberately KEEP the older
  #    `liquidityTranche*` spelling, and `DayVaultState.minorType` keeps the value
  #    "liquidity" — that value is part of DayFeeState's entity id, so moving it would
  #    fork every fee row's lineage for a pure rename. The `<- ABI:` annotations are the
  #    bridge: where a column says `liquidityTranche` the ABI says `lpt`. See MIGRATION-v2.md.
  # ======
  # ======
  # => data from "RoycoDayAccountant.getState()" (26-member struct)
  seniorTrancheProtocolFeeWAD: BigInt! # Senior Tranche Protocol Fee WAD <- ABI: stProtocolFeeWAD
  juniorTrancheProtocolFeeWAD: BigInt! # Junior Tranche Protocol Fee WAD <- ABI: jtProtocolFeeWAD
  juniorTrancheYieldShareProtocolFeeWAD: BigInt! # Junior Tranche Yield Share Protocol Fee WAD <- ABI: jtYieldShareProtocolFeeWAD
  liquidityTrancheYieldShareProtocolFeeWAD: BigInt! # Liquidity Tranche Yield Share Protocol Fee WAD <- ABI: lptYieldShareProtocolFeeWAD
  minCoverageWAD: BigInt! # Min Coverage WAD <- ABI: minCoverageWAD
  minLiquidityWAD: BigInt! # Min Liquidity WAD <- ABI: minLiquidityWAD
  marketState: String! # Market State (Enum: "perpetual" -> 0 in Contract.MarketState, "fixed" -> 1 in Contract.MarketState)
  # ^ The enum order is PERPETUAL, FIXED_TERM — see contracts/libraries/Types.sol.
  #   0 is PERPETUAL, not "fixed". Do not "correct" this back; it reads backwards.
  # ^ <- ABI: lastMarketState (uint8 -> i32). NOTE: this is the LAST SYNCED state.
  #   The LIVE state is previewSyncTrancheAccountingFor().state.marketState. They
  #   disagree between syncs — this field is deliberately the stored one.
  fixedTermDurationSeconds: BigInt! # Fixed Term Duration Seconds <- ABI: fixedTermDurationSeconds (uint24 -> i32! needs BigInt.fromI32)
  fixedTermEndTimestamp: BigInt! # Fixed Term End Timestamp <- ABI: fixedTermEndTimestamp (uint32 -> BigInt, direct)
  fixedTermCommenceableAtTimestamp: BigInt! # Fixed Term Commenceable At Timestamp <- ABI: fixedTermCommenceableAtTimestamp (uint64 -> BigInt, direct)
  # ^ Earliest time a term may begin. Unlike fixedTermEndTimestamp, this is a market-wide
  #   floor. The factory seeds it from getState(); both deployed and latest event names
  #   remain wired for later updates.
  lastYieldShareAccruedTimestamp: BigInt! # Last Yield Share Accrued Timestamp <- ABI: lastYieldShareAccrualTimestamp
  lastPremiumPaymentTimestamp: BigInt! # Last Premium Payment Timestamp <- ABI: lastPremiumPaymentTimestamp
  timeWeightedJuniorTrancheYieldShareAccruedWAD: BigInt! # Time Weighted Junior Tranche Yield Share Accrued WAD <- ABI: twJTYieldShareAccruedWAD (uint128 -> BigInt, direct)
  # ^ A SAWTOOTH, NOT A LIFETIME TOTAL. Both timeWeighted* accumulate on every accrual and
  #   are ZEROED whenever premiums are paid out of ST yield, so a negative delta between
  #   reads is the reset, not a data error. They measure only what has accrued SINCE
  #   lastPremiumPaymentTimestamp, which is the field to segment them by.
  #
  # !! SOURCED FROM getState() ON EVERY SYNC, not from YieldSharesAccrued alone. The
  #    event carries the POST-increment values and the same call then deletes both
  #    (RoycoDayAccountant.sol:158-163) emitting nothing — no accountant event signals the
  #    reset — so an event-only column could ratchet up and never come back down. It would
  #    also contradict lastPremiumPaymentTimestamp, which the reset stamps in the same
  #    block. See refreshMarketStoredState. (DayYieldSharesAccruedHistory's copies stay
  #    event-sourced: a history row wants the value at that instant, pre-reset.)
  maxJuniorTrancheYieldShareAccruedWAD: BigInt! # Max Junior Tranche Yield Share WAD <- ABI: maxJTYieldShareWAD
  # ^ NOTE: this is a CONFIGURED CAP (set via setMaxYieldShares / MaxYieldSharesUpdated),
  #   NOT an accrual — despite the "Accrued" in the field name. The real accrual is
  #   timeWeightedJuniorTrancheYieldShareAccruedWAD directly above. Do not average them.
  timeWeightedLiquidityTrancheYieldShareAccruedWAD: BigInt! # Time Weighted Liquidity Tranche Yield Share Accrued WAD <- ABI: twLPTYieldShareAccruedWAD (uint128)
  maxLiquidityTrancheYieldShareAccruedWAD: BigInt! # Max Liquidity Tranche Yield Share WAD <- ABI: maxLPTYieldShareWAD (also a CAP, see above)
  coverageLiquidationUtilizationWAD: BigInt! # Coverage Liquidation Utilization WAD <- ABI: coverageLiquidationUtilizationWAD
  dustTolerance: BigInt! # Dust Tolerance <- ABI: dustTolerance
  # ^ ONE tolerance now, where v1 had THREE (stNAVDustTolerance, jtNAVDustTolerance and a
  #   cached effectiveNAVDustTolerance = st + jt). Senior and junior share one collateral
  #   asset, so one tolerance covers both, and it arrives on its own DustToleranceUpdated
  #   event. That deletes v1's nastiest handler quirk: effectiveNAVDustTolerance had NO
  #   event and had to be recomputed inside both dust handlers or it drifted stale forever.
  # ======
  # ======
  # => data from "RoycoDayKernel.getState()" (19-member struct)
  protocolFeeRecipientAddress: String! # Protocol Fee Recipient Address <- ABI: protocolFeeRecipient
  seniorTrancheSelfLiquidationBonusWAD: BigInt! # Senior Tranche Self Liquidation Bonus WAD <- ABI: stSelfLiquidationBonusWAD
  totalCollateralAssets: BigInt! # Total Collateral Assets, in collateral-token units <- ABI: totalCollateralAssets
  # ^ Replaces v1's separate stOwnedYieldBearingAssets + jtOwnedYieldBearingAssets. The
  #   senior and junior tranches are coinvested in ONE collateral asset now, so the kernel
  #   tracks a single balance and the split no longer exists on chain to record.
  totalLiquidityTrancheAssets: BigInt! # Total Liquidity Tranche Assets, in LPT-asset units <- ABI: totalLPTAssets
  liquidityTrancheOwnedSeniorTrancheShares: BigInt! # Liquidity Tranche Owned Senior Tranche Shares <- ABI: lptOwnedSeniorTrancheShares
  collateralAssetOracleAddress: String! # Collateral Asset Oracle Address <- ABI: collateralAssetOracle
  collateralAssetOracleStalenessThresholdSeconds: BigInt! # Staleness Threshold Seconds <- ABI: stalenessThresholdSeconds (uint48 -> BigInt, direct)
  sequencerUptimeFeedAddress: String! # Sequencer Uptime Feed Address <- ABI: sequencerUptimeFeed
  sequencerUptimeFeedGracePeriodSeconds: BigInt! # Grace Period Seconds <- ABI: gracePeriodSeconds (uint48 -> BigInt, direct)
  roycoBlacklistAddress: String! # Royco blacklist contract used by the kernel
  kernelPaused: Boolean! # Whether market operations are paused at the kernel
  bptOracleAddress: String! # Balancer Pool Token Oracle Address <- ABI: getBalancerV3LiquidityVenueState().bptOracle
  maxReinvestmentSlippageWAD: BigInt! # Maximum Liquidity Premium Reinvestment Slippage WAD <- ABI: getBalancerV3LiquidityVenueState().maxReinvestmentSlippageWAD
  # ^ These configuration fields stay fresh through CollateralAssetOracleUpdated,
  #   SequencerUptimeFeedUpdated, RoycoBlacklistUpdated, BPTOracleUpdated, and
  #   MaxReinvestmentSlippageUpdated.
  # ======
  # ======
  # => the market's three ASSET TOKENS, from Kernel.getState() — members 4, 6 and 8 of
  #    RoycoDayKernelState. They were standalone SCREAMING_CASE views until the 2026-08
  #    kernel folded them in, and QUOTE_ASSET was `virtual` and bodyless there, so a
  #    venue-less kernel reverted on it; a struct member cannot.
  #
  # Read ONCE at market creation and never updated, but NOT because they are Solidity
  # `immutable` — RoycoDayKernel is a beacon proxy with no constructor and declares no
  # `immutable` at all. They are ERC-7201 storage slots assigned exactly once in
  # InitializationLogic.sol:48-52, and held fixed by the ABSENCE OF A SETTER (that is
  # the real guarantee, and it is why no event exists for any of them).
  #
  # !! THESE ARE NOT INDEPENDENT DATA — the kernel's INITIALIZER requires
  #    seniorTranche.asset() == COLLATERAL_ASSET && juniorTranche.asset() == COLLATERAL_ASSET
  #    && liquidityProviderTranche.asset() == LPT_ASSET
  #    (InitializationLogic.sol:29-33, TRANCHE_AND_KERNEL_ASSETS_MISMATCH). So
  #    collateralTokenAddress MUST equal the senior and junior DayVaultState.assetTokenAddress,
  #    and liquidityTrancheAssetTokenAddress MUST equal the liquidity one. Storing them
  #    here is a market-level convenience — one row instead of a three-way vault join —
  #    and a free cross-check: if they ever disagree in Neon, something is very wrong.
  #    quoteAssetTokenAddress is the exception: it exists on NO tranche, so this is its
  #    only home.
  collateralTokenAddress: String! # Collateral Token Address <- ABI: Kernel.getState().collateralAsset
  collateralTokenId: String! # Collateral Token ID: <CHAIN_ID>_<COLLATERAL_TOKEN_ADDRESS>_<MARKET_ID>_collateralAsset
  collateralAssetTokenSymbol: String! # Collateral Asset Token Symbol (ERC20.symbol())
  collateralAssetTokenDecimals: Int! # Collateral Asset Token Decimals (ERC20.decimals() -> uint8 -> i32; Int! IS i32, assign direct)
  liquidityTrancheAssetTokenAddress: String! # Liquidity Tranche Asset Token Address <- ABI: Kernel.getState().lptAsset
  liquidityTrancheAssetTokenId: String! # Liquidity Tranche Asset Token ID: <CHAIN_ID>_<LPT_ASSET_ADDRESS>_<MARKET_ID>_lptAsset
  liquidityTrancheAssetTokenSymbol: String! # Liquidity Tranche Asset Token Symbol (ERC20.symbol())
  liquidityTrancheAssetTokenDecimals: Int! # Liquidity Tranche Asset Token Decimals (ERC20.decimals() -> uint8 -> i32; Int! IS i32, assign direct)
  quoteAssetTokenAddress: String! # Quote Asset Token Address <- ABI: Kernel.getState().quoteAsset
  quoteAssetTokenId: String! # Quote Asset Token ID: <CHAIN_ID>_<QUOTE_ASSET_ADDRESS>_<MARKET_ID>_quoteAsset
  quoteAssetTokenSymbol: String! # Quote Asset Token Symbol (ERC20.symbol())
  # ^ EVERY *TokenSymbol / *TokenDecimals COLUMN DESCRIBES THE TOKEN IN THE *TokenAddress
  #   COLUMN BESIDE IT, and all six are read the same way: ERC20.symbol() / .decimals() at
  #   market creation, guarded (erc20Symbol / erc20Decimals in src/royco-factory.ts). Read
  #   once and never refreshed, because all three tokens are `immutable` on the kernel —
  #   neither view can change its answer and no event exists for any of them (§5).
  #
  #   THE DECIMALS on the first two DUPLICATE the matching DayVaultState.assetTokenDecimals
  #   — collateral on senior and junior, LPT on liquidity — deliberately, for exactly the
  #   reason the addresses above are duplicated: one market row instead of a three-way
  #   vault join, and a free cross-check if the two ever disagree in Neon. THE SYMBOLS have
  #   no counterpart at all: DayVaultState carries no symbol column, so these three plus
  #   the tranche symbols below are the whole schema's supply of human-readable token
  #   labels, and the only way to render a market without an off-chain token list.
  #
  #   "" AND 0 ARE THE SENTINELS ON ALL SIX, never a symbol-less token and never a real
  #   0-decimals one — pair each with the *TokenAddress beside it, which is the zero
  #   address exactly when the token is absent. That matters most on the counterparty
  #   slots: a market may omit its junior OR its liquidity tranche, and an omitted slot
  #   gets no DayVaultState at all, so a consumer cannot fall back to the vault column
  #   for it.
  # ^ THESE THREE ARE MARKET-SCOPED AND ROLE-TAGGED, unlike every other *TokenId column
  #   in this schema. DayVaultState.assetTokenId / shareTokenId and the two frozen
  #   Global* tokenId columns are chain-global (<CHAIN_ID>_<TOKEN_ADDRESS>), so two
  #   markets sharing a collateral token produce the SAME id there. Here the market and
  #   the token's ROLE are appended, so a token that is collateral in one market and the
  #   quote asset in another stays distinguishable, and a market's three token rows group
  #   under its own prefix. Built by generateMarketTokenId; the role suffix comes from a
  #   MARKET_TOKEN_ROLE_* constant, never a literal.
  #
  #   Consequence for Neon: do NOT join these three to a chain-global token table on
  #   equality — strip the trailing <MARKET_ID>_<ROLE>, or join on the *Address column
  #   beside each of them, which is unchanged.
  quoteAssetTokenDecimals: Int! # Quote Asset Token Decimals (ERC20.decimals() -> uint8 -> i32; Int! IS i32, assign direct)
  balancerVaultAddress: String! # Balancer V3 Vault Address <- ABI: BalancerPoolToken(LPT_ASSET).getVault()
  quoteAssetPoolIndex: Int! # Which slot of the BPT's 2-token registration order the QUOTE asset occupies (0 or 1)
  # ^ The BPT pairs the senior share token with the quote asset. Current contracts pin
  #   the quote asset to slot 1, but the subgraph still resolves it by address so the
  #   stored index remains valid if venue ordering changes.
  #
  #   BOTH ARE IMMUTABLE ON CHAIN — the vault is `immutable` on the venue and the ordering
  #   is fixed at pool registration — so they are read ONCE at market creation and
  #   cached here. That is the whole point of storing them: the sync path then needs a
  #   single getPoolTokenRates call instead of re-deriving the vault and the ordering on
  #   every sync, on the hottest path in the subgraph.
  #
  #   quoteAssetPoolIndex is meaningless when balancerVaultAddress is the zero address
  #   (a kernel with no Balancer venue). Read it together with that field, never alone;
  #   0 is both "slot 0" and "unknown", exactly as quoteAssetTokenDecimals is.
  # ^ THE ONLY RECORD OF THE QUOTE TOKEN'S SCALE anywhere in this schema. The other two
  #   asset tokens ALSO carry their decimals on their tranche's DayVaultState; the quote
  #   asset has no tranche and no DayVaultState, so without this column the `quoteAssets`
  #   amounts on DayMultiAssetDepositActivity and DayMultiAssetRedeemActivity are raw
  #   integers with no scale attached and cannot be rendered or compared.
  #
  #   Read with try_ and defaulting to 0. On a venue-less market getState().quoteAsset is
  #   the zero address, and ERC20(0x0).decimals() would revert. 0 paired with a zero address is
  #   the truthful "no quote asset" answer — it is NOT a real 0-decimals token, and the
  #   address is what disambiguates.
  # ^ The venue's non-senior constituent — the token paid in on a multi-asset LP
  #   deposit and out on a multi-asset redeem (DayMultiAssetDeposit/RedeemActivity's
  #   `quoteAssets` column is denominated in it). It has no tranche and no DayVaultState,
  #   so without this field the amounts in those two tables have no token attached.
  #
  #   The asset addresses themselves require no extra calls: all three come from the
  #   already-decoded Kernel state. A venue-less market reports the zero quote address.
  #
  #   THE SYMBOL AND DECIMALS BESIDE THEM STILL NEED A GUARD — every *TokenSymbol and
  #   *TokenDecimals column goes through erc20Symbol / erc20Decimals in
  #   src/royco-factory.ts. A raw call that reverted would kill
  #   handleMarketDeploymentCompleted, taking the market, all three vaults and every
  #   downstream row with it.
  # ======
  # ======
  # => the three tranches' SHARE TOKEN metadata, read once at market creation.
  #
  # A TRANCHE IS ITS OWN SHARE TOKEN, so these are symbol()/decimals() on the addresses
  # already in the *TrancheAddress columns above. Fixed when the tranche initialises, with
  # no event for either, so they are read once and never refreshed (§5).
  #
  # The DECIMALS duplicate DayVaultState.shareTokenDecimals for the same tranche — one
  # market row instead of a three-way vault join, plus a free cross-check if the two ever
  # disagree in Neon. The SYMBOLS have no counterpart anywhere: DayVaultState carries no
  # symbol column, so this row is the only place a market's tranches can be labelled
  # without an off-chain token list.
  #
  # AN ABSENT COUNTERPARTY TRANCHE READS AS "" / 0 — a market carries a senior plus at
  # least one counterparty, so the junior OR the liquidity slot may be the zero address,
  # and that slot gets no DayVaultState at all. Pair these with the matching
  # *TrancheAddress, which is zero exactly when the tranche does not exist.
  seniorTrancheTokenSymbol: String! # Senior Tranche Share Token Symbol <- ABI: seniorTranche.symbol()
  seniorTrancheTokenDecimals: Int! # Senior Tranche Share Token Decimals <- ABI: seniorTranche.decimals() (uint8 -> i32; Int! IS i32, assign direct)
  juniorTrancheTokenSymbol: String! # Junior Tranche Share Token Symbol <- ABI: juniorTranche.symbol()
  juniorTrancheTokenDecimals: Int! # Junior Tranche Share Token Decimals <- ABI: juniorTranche.decimals()
  liquidityTrancheTokenSymbol: String! # Liquidity Tranche Share Token Symbol <- ABI: liquidityProviderTranche.symbol()
  liquidityTrancheTokenDecimals: Int! # Liquidity Tranche Share Token Decimals <- ABI: liquidityProviderTranche.decimals()
  # ======
  # ======
  # => data from "RoycoDayKernel.previewSyncTrancheAccountingFor(_trancheType)"
  #
  #    RENAMED in v2 from previewSyncTrancheAccounting. Still the KERNEL overload, not
  #    the Accountant's previewSyncTrancheAccounting(NAV_UNIT), which makes you supply
  #    the very NAV you are trying to read and returns no claims.
  #    Kernel: previewSyncTrancheAccountingFor(uint8 _trancheType)
  #              -> (SyncedAccountingState state, AssetClaims claims, uint256 totalTrancheShares)
  #
  #    The fields below all come from `state`, which is TRANCHE-INDEPENDENT — so
  #    any _trancheType works for this market-level entity. Callers that consume
  #    `claims` must pass that tranche's own TRANCHE_TYPE() instead.
  collateralNAV: BigInt! # Collateral NAV <- ABI: state.collateralNAV
  # ^ Replaces v1's seniorTrancheRawNAV + juniorTrancheRawNAV. One coinvested collateral
  #   pool, one raw NAV. The per-tranche split survives only as the EFFECTIVE NAVs below,
  #   which is where the coverage model actually lives.
  liquidityTrancheRawNAV: BigInt! # Liquidity Tranche Raw NAV <- ABI: state.lptRawNAV
  # ^ REAL as of the v2 sync rework. Both sync events now emit AFTER _commitLPTRawNAV,
  #   which refreshes lptRawNAV and liquidityUtilizationWAD in the state packet in
  #   place. In v1 this column and the one below were permanently zero, because the
  #   single sync event marshalled them as placeholders.
  seniorTrancheEffectiveNAV: BigInt! # Senior Tranche Effective NAV <- ABI: state.stEffectiveNAV
  juniorTrancheEffectiveNAV: BigInt! # Junior Tranche Effective NAV <- ABI: state.jtEffectiveNAV
  juniorTrancheImpermanentLoss: BigInt! # Junior Tranche Impermanent Loss <- ABI: state.jtImpermanentLoss
  # ^ v1 called this juniorTrancheCoverageImpermanentLoss; v2 drops "Coverage" from the
  #   contract member, and the column follows.
  liquidityTrancheLiquidityPremium: BigInt! # Liquidity Tranche Liquidity Premium <- ABI: state.lptLiquidityPremium
  coverageUtilizationWAD: BigInt! # Coverage Utilization WAD <- ABI: state.coverageUtilizationWAD
  liquidityUtilizationWAD: BigInt! # Liquidity Utilization WAD <- ABI: state.liquidityUtilizationWAD
  # ^ REAL too — see liquidityTrancheRawNAV above. _commitLPTRawNAV recomputes it as
  #   UtilizationLogic._computeLiquidityUtilization(stEffectiveNAV, minLiquidityWAD,
  #   lptRawNAV) before the emit.
  #
  # v1 also stored `isJuniorTrancheCoinvested` here, from state.jtCoinvested. That member
  # is GONE from SyncedAccountingState in v2 — coinvestment is no longer a per-market
  # toggle — so the column is dropped rather than frozen at a guess.
  # ======
  # ======
  # => records
  #
  # FIVE cursors, for the five streams that keep EVERY event as its own row:
  # DayFixedTermHistory, DayYieldSharesAccruedHistory, and the three liquidity-premium
  # streams. The remaining *Historical SNAPSHOT tables collapse to one row per block and
  # carry no counter at all — see "BLOCK-KEYED HISTORY" below for which is which and why.
  #
  # Each is a COUNT, not a last-index: a market legitimately has zero fixed terms (or
  # zero premium mints) forever, so a last-index has no truthful initial value — 0
  # would falsely assert one entry exists. Write protocol is use-THEN-increment:
  #   const idx = market.countXEntries;   // this IS the next entryIndex
  #   ... build the id from idx, set entity.entryIndex = idx ...
  #   market.countXEntries = idx.plus(BigInt.fromI32(1));
  #
  # So the first record is entryIndex 0 and the count becomes 1. Total == count.
  # The last record sits at (count - 1), readable ONLY when count > 0.
  # Seed all five to BigInt.zero() in the MarketDeploymentCompleted handler's
  # `if (!entity)` branch — a non-null field left unset is fatal at index time (§8).
  countFixedTermEntries: BigInt! # Count of Fixed Term Entries -> DayFixedTermHistory
  # ^ Advances on FixedTermCommenced and on loss-only rows created while
  #   fixedTermDurationSeconds is zero. DayFixedTermHistory is the one MUTABLE record
  #   stream: the close-out writes patch the row at (count - 1) and must NOT
  #   increment this.
  countYieldSharesAccruedEntries: BigInt! # Count of Yield Shares Accrued Entries -> DayYieldSharesAccruedHistory
  # ^ ONE cursor where v1 had two. v2 merged JuniorTrancheYieldShareAccrued and
  #   LiquidityTrancheYieldShareAccrued into a single YieldSharesAccrued carrying all
  #   four values, so the two accruals are now one atomic event and get one row.
  countLiquidityPremiumSharesMintedEntries: BigInt! # Count of Liquidity Premium Shares Minted Entries -> DayLiquidityPremiumSharesMintedHistory
  countLiquidityPremiumReinvestedEntries: BigInt! # Count of Liquidity Premium Reinvested Entries -> DayLiquidityPremiumReinvestedHistory
  countLiquidityPremiumReinvestmentFailedEntries: BigInt! # Count of Liquidity Premium Reinvestment Failed Entries -> DayLiquidityPremiumReinvestmentFailedHistory
  #   or redemption. NOT the AMM-frequency stream it was in v1: the pre-op event, which
  #   is what fires on swaps, is deliberately not indexed (see that entity's note).
  #
  # A LIFETIME ACCUMULATOR, not a cursor and not a mirror of any on-chain value.
  # Every JuniorTrancheImpermanentLossReset adds its erased amount here, so this only
  # ever grows: it answers "how much JT loss has this market written off in total?",
  # which no contract tracks and no getState() member holds.
  #
  # !! DO NOT CONFUSE WITH `juniorTrancheImpermanentLoss` ABOVE. They sit in one row,
  #    differ by one word, and mean opposite things:
  #      juniorTrancheImpermanentLoss     = the LIVE, point-in-time loss, from the
  #                                         preview block. Goes UP and DOWN, and is
  #                                         reset to 0 on every erase.
  #      juniorTrancheImpermanentLossNAV  = the LIFETIME TOTAL of everything erased.
  #                                         MONOTONIC; never decreases.
  #    In Neon: junior_tranche_impermanent_loss vs junior_tranche_impermanent_loss_nav.
  #    Summing or comparing the two is meaningless.
  #
  # Counts EVERY erase, not just term ends — unlike
  # DayFixedTermHistory.juniorTrancheImpermanentLossNAV, which is per-term and only
  # records the erase that ENDED that term. The erase branch fires on already-perpetual
  # markets too, so this total is >= the sum of the per-term rows, by design.
  #
  # NAV_UNIT, like every other *NAV field here. Seeded to zero at market creation:
  # nothing has been erased yet, and there is no contract value to read.
  juniorTrancheImpermanentLossNAV: BigInt! # Junior Tranche Impermanent Loss NAV (cumulative, monotonic)
  # ======
  # ======
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
  updatedAtTransactionHash: String! # Updated At Transaction Hash
  updatedAtBlockNumber: BigInt! # Updated At Block Number
  updatedAtBlockTimestamp: BigInt! # Updated At Block Timestamp
}

# Immutable accountant -> market lookup written by the factory. Accountant events emitted
# before MarketDeploymentCompleted have no row yet and are intentionally skipped.
type DayAccountantMarketMap @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<ACCOUNTANT_ADDRESS>
  marketRefId: String! # DayMarketState.id: <CHAIN_ID>_<MARKET_ID>
}

# =============================================================================
# ASSET CLAIMS — the quadruple. Read this before touching any claims*/sharePrice*
# field anywhere in this file.
#
# This block is the canonical note. It lives on its own rather than on an entity
# because the entities that carry the struct change over time — it used to hang off
# DayVaultState, which no longer has one — and a "see the note above" pointing at a
# deleted note is worse than no note.
#
# `AssetClaims = (collateralAssets, lptAssets, stShares, nav)`
# (contracts/libraries/Types.sol — the struct is AssetClaims; `claims` is only ever a
# variable name). THESE ARE NOT ERC-4626 VAULTS: on all three tranches
# convertToAssets / totalAssets / previewRedeem return this STRUCT, not a uint256.
# Only previewDeposit is a scalar. The mapping is fixed:
#
#   .collateralAssets -> claimsCollateralAssets        .stShares -> claimsSeniorTrancheShares
#   .lptAssets        -> claimsLiquidityTrancheAssets   .nav      -> claimsNAV
#
# !! FOUR MEMBERS IN v2, NOT FIVE. v1's separate `stAssets` and `jtAssets` collapsed
#    into one `collateralAssets` when senior and junior became coinvested in a single
#    collateral token. Consequence beyond the column count: `Redeem` and
#    `MultiAssetRedeem` embed this struct, so their TOPIC0 CHANGED even though their
#    names and parameter lists did not.
#
# THE `claims` PREFIX IS LOAD-BEARING, not decoration. Without it
# `seniorTrancheShares` sits beside a row's own `shares` / `sharesTotalSupply` looking
# like a sibling, when the two are unrelated: one is the row's own share balance, the
# other is senior-tranche shares held INSIDE the claim. DayMarketNav's
# `<tranche>SharePrice<leg>` names are the same struct under a different prefix,
# because that entity carries three of them at once.
#
# NOT REDEMPTION PROCEEDS. previewRedeem is a different call down a different kernel
# path. convertToAssets is the pro-rata ACCOUNTING claim — what the shares represent.
# Never name or describe it as "redeemable".
#
# !! LIQUIDITY TRANCHE ASYMMETRY (RoycoVaultTranche.convertToAssets):
#    on the LPT — and ONLY the LPT — the tranche rewrites the struct before scaling:
#    stShares is forced to 0 and nav is taken from state.lptRawNAV. Idle
#    (un-reinvested) ST shares are excluded so the LPT share price cannot tick down on
#    reinvestment slippage. So a zero claimsSeniorTrancheShares on a liquidity row is
#    CORRECT, not missing data. claimsNAV keeps its meaning — the total NAV of the
#    claim — on every tranche; the LPT claim simply contains no ST shares, so its NAV
#    is lptRawNAV. Same unit, same definition, narrower claim.
#    All three tranches declare byte-identical convertToAssets signatures, so this is
#    invisible from the ABI. Only contracts/ shows it (§4).
#
# WHICH LEGS ARE STRUCTURALLY ZERO depends on the tranche, decided one level down in
# TrancheClaimsLogic._deriveTrancheAssetClaims. In v2 it is symmetric and simple:
#   SENIOR / JUNIOR      set nav + collateralAssets  =>  lptAssets and stShares are 0
#   LIQUIDITY_PROVIDER   set nav + lptAssets + stShares  =>  collateralAssets is 0,
#                        and the convertToAssets rewrite above then forces stShares to 0
# So exactly TWO of the four legs are live on every tranche. A zero there is the
# contract's answer, not a failed read.
#
# UNITS are NOT uniform across the four: collateralAssets and lptAssets are
# TRANCHE_UNIT in two DIFFERENT tokens, stShares is a raw uint256 share count, and only
# nav is NAV_UNIT. Never sum or compare across legs.
# =============================================================================

# =============================================================================
# THE MARKET'S PRICE VECTOR — all three tranches priced in ONE row.
#
# Per tranche: a SHARE price (the full AssetClaims quadruple), plus an ASSET price
# (a NAV_UNIT scalar) per distinct asset. THREE of those: collateral (shared by senior
# and junior, which are coinvested in one token), the LPT asset, and the venue's quote
# asset. 3 + 12 = 15 price columns.
#
# THE SOLE HOME of the share-price claims. DayVaultState used to carry a per-vault
# copy of this struct and no longer does — the per-vault rows could not answer the
# question these are for, because DayVaultStateHistorical advances on each vault's OWN
# mint/burn cursor, so entry N on the senior and entry N on the junior are different
# moments and "the market's price vector at time T" was unreconstructable without a
# three-way as-of join. Here all three tranches are captured AT THE SAME INSTANT, by
# construction. Since v2 this is the ONLY place any price is stored: DayVaultState
# carries none at all.
#
# TWO WRITE SITES, TWO DIFFERENT SOURCES — the asymmetry is the whole design:
#   1. MarketDeploymentCompleted -> entry 0, at the BOOTSTRAP price. The three
#      *SharePriceNAV legs are ONE WHOLE NAV UNIT — a tranche opens at $1 per whole
#      share, the rate the first depositor mints at — and each tranche's OWN asset leg
#      carries that same $1 denominated in that asset, via the kernel's inverse
#      converters (convertValueToCollateralAssets for senior+junior,
#      convertValueToLPTAssets for liquidity; both `try_`, since they divide by an
#      oracle price). The other legs stay 0 exactly as TrancheClaimsLogic's branch
#      leaves them, and stShares is 0 on every tranche. The nav leg needs no call at
#      all — supply is provably zero at deployment, so it is arithmetic, not a lookup,
#      and it survives an oracle revert that blanks the asset leg. Do NOT source any of
#      it from convertToAssets,
#      which returns the ZERO struct at zero supply — that call answers "pro-rata claim on
#      real assets", not "price", because AssetLedgerLogic._scaleAssetClaims
#      short-circuits at `_totalTrancheShares == 0` before the virtual-share arithmetic
#      that defines the rate (ValuationLogic._computeTrancheShareRate).
#      quoteAssetPriceNAV is the exception:
#      it needs the pool, so creation pays getVault + getPoolTokens (resolving the vault
#      and slot it then caches on DayMarketState) + getPoolTokenRates — THREE calls, or
#      zero on a market with no Balancer venue, where QUOTE_ASSET already reverted and
#      there is nothing to ask.
#   2. TrancheAccountingSynced -> every later entry. Here all 15 values MUST be
#      re-read live. The sync payload carries MARKET-level NAVs
#      (collateralNAV, jtEffectiveNAV, ...) and no per-share or per-asset-token price at
#      all, and the DayVaultState copies are stale between mints/burns. SIX calls for 15
#      columns: 2 Kernel asset-price converters + 1 pool getPoolTokenRates (the vault and
#      slot are already cached, so the quote leg costs one call, not three) + 3
#      convertToAssets, each returning a whole quadruple. That is the hottest path in
#      this subgraph — see the cost note on refreshMarketNav in
#      src/handlers/base/market-nav.ts.
#
# THE NAV_UNIT PRICES, and what they are denominated in:
#   *AssetPriceNAV = the NAV value of ONE WHOLE ASSET TOKEN (10 ** assetTokenDecimals)
#                    — collateral for senior+junior, the LPT asset for liquidity, and the
#                    venue's quote token. The quote one needs NO decimals argument: its
#                    price is the pool's registered rate outright, because the raw
#                    10 ** (18 - decimals) scaling factor cancels the 10 ** decimals
#                    amount exactly. See quoteAssetPriceNAV's own note.
#   *SharePriceNAV = the NAV value of ONE WHOLE SHARE       (10 ** shareTokenDecimals)
# The two denominators are different tokens with independently-configured decimals.
# Never divide one by the other, and never compare an asset price to a share price.
# The share price's other four legs are NOT NAV_UNIT — see the units note on that
# group below before touching them.
#
# No `marketRefId` column, deliberately: this id IS <CHAIN_ID>_<MARKET_ID>, i.e.
# byte-identical to DayMarketState.id, so the join key is already `id`. (The
# historical row below DOES carry it — its own id has the block number appended, so
# there the pointer is not derivable without parsing.) Same asymmetry as
# DayVaultState (no self `vaultId`) vs DayVaultStateHistorical (has one).
# =============================================================================
type DayMarketNav @entity(immutable: false) {
  id: String! # <CHAIN_ID>_<MARKET_ID> — byte-identical to DayMarketState.id
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  collateralAssetPriceNAV: BigInt! # Collateral Asset Price NAV <- ABI: Kernel.convertCollateralAssetsToValue(10 ** assetTokenDecimals) — covers senior AND junior, which share one asset
  liquidityTrancheAssetPriceNAV: BigInt! # Liquidity Tranche Asset Price NAV <- ABI: Kernel.convertLPTAssetsToValue(10 ** assetTokenDecimals)
  quoteAssetPriceNAV: BigInt! # Quote Asset Price NAV <- ABI: BalancerV3Vault.getPoolTokenRates(BPT).tokenRates[quoteAssetPoolIndex]
  # ^ THE THIRD ASSET PRICE, and the only one not read from a Kernel view — there is no
  #   Kernel.convertQuoteAssetsToValue. It comes straight off the Balancer pool instead,
  #   and the arithmetic collapses to an identity:
  #
  #     NAV(one whole quote token) = amount x decimalScalingFactor x rate / WAD
  #                                = 10^d  x 10^(18-d)            x rate / 1e18
  #                                = rate
  #
  #   decimalScalingFactors[i] is a RAW 10 ** (18 - decimals) factor, not a fixed-point
  #   number (PoolConfigLib.sol:255-257 says so explicitly), so the two powers of ten
  #   cancel exactly and no rounding enters. The stored value IS tokenRates[i].
  #
  #   WHY THAT IS THE RIGHT NUMBER: the whole NAV numeraire of a Day market is defined by
  #   how the BPT oracle is wired. Its price feeds are constant 1.0 on both legs, so no
  #   pricing enters through Chainlink at all — every bit of it enters through the pool's
  #   rate providers. The senior leg's provider is the kernel itself (NAV per ST share);
  #   the quote leg's is its configured rate provider, or an implicit FP(1) when the token
  #   is registered STANDARD. Each leg's scaled18 balance is therefore already in NAV
  #   units, which is why the venue can wrap computeTVL() straight into NAV_UNIT. So the
  #   quote leg's NAV price is DEFINITIONALLY its pool token rate — and for a STANDARD
  #   quote (USDC) that rate is 1.0, which is precisely what pins the market's numeraire
  #   to USD.
  #
  #   ZERO on a market with no Balancer venue, where balancerVaultAddress is the zero
  #   address and there is no pool to ask. Same convention as quoteAssetTokenAddress.
  # ^ ABI: Kernel.convertCollateralAssetsToValue / convertLPTAssetsToValue, each called
  #   with (10 ** assetTokenDecimals). TWO methods in v2, not three: senior and junior
  #   share one collateral asset, so they route to the SAME converter. Dispatch on the
  #   vault's own minorType — never on TRANCHE_TYPE() == 0/1/2, which is an inference (§6).
  # --- THREE AssetClaims QUADRUPLES: one whole share of each tranche. ---
  #
  # Each group is tranche.convertToAssets(10 ** shareTokenDecimals) in full — the
  # AssetClaims struct (collateralAssets, lptAssets, stShares, nav) in ABI order, per the
  # "ASSET CLAIMS" block. Naming is <WHOSE SHARE>SharePrice<WHICH LEG>, so the
  # *SharePriceNAV fields are simply the `nav` leg of their own group.
  #
  # FREE relative to keeping only `nav`: convertToAssets already returns the whole
  # struct, so the extra legs per tranche cost no additional eth_call.
  #
  # !! SIX OF THESE TWELVE ARE INVARIANTLY ZERO — structurally, not incidentally.
  #    Verified in contracts/, and invisible from the ABI (all three tranches declare
  #    byte-identical convertToAssets, §4). A zero here is CORRECT, never missing data:
  #
  #      TrancheClaimsLogic._deriveTrancheAssetClaims fills only SOME legs and leaves
  #      the rest at Solidity's memory zero; _scaleAssetClaims then multiplies every leg
  #      through, so the zeros survive scaling:
  #        SENIOR / JUNIOR branch    sets nav + collateralAssets
  #                                    -> lptAssets, stShares stay 0
  #        LIQUIDITY_PROVIDER branch sets nav + lptAssets + stShares
  #                                    -> collateralAssets stays 0
  #      and then RoycoVaultTranche.convertToAssets rewrites the LPT, and ONLY the LPT,
  #      before scaling: stShares -> 0, nav -> state.lptRawNAV. Idle un-reinvested ST
  #      shares are excluded so the LPT share price cannot tick down on reinvestment
  #      slippage. That kills the LPT's third leg.
  #
  #    So exactly TWO legs move per tranche: senior/junior collateralAssets+nav, and
  #    liquidity lptAssets+nav. Do not "fix" a zero column, and do not drop them —
  #    they are kept so the row is the whole struct.
  #
  # UNITS — THREE different ones in this group; the header's NAV_UNIT rule does NOT
  # extend here. Never sum or compare across them:
  #   *CollateralAssets / *LiquidityTrancheAssets
  #                   TRANCHE_UNIT in two DIFFERENT tokens with different decimals
  #   *SeniorTrancheShares  a raw uint256 SHARE COUNT — not a unit type at all
  #   *NAV            NAV_UNIT — the only leg comparable ACROSS tranches, which is why
  #                   it is the one the header treats as the price vector proper
  seniorTrancheSharePriceCollateralAssets: BigInt! # <- claims.collateralAssets of the SENIOR tranche's share
  seniorTrancheSharePriceLiquidityTrancheAssets: BigInt! # <- claims.lptAssets (INVARIANTLY 0 — the SENIOR branch never sets it)
  seniorTrancheSharePriceSeniorTrancheShares: BigInt! # <- claims.stShares (INVARIANTLY 0 — likewise)
  seniorTrancheSharePriceNAV: BigInt! # <- claims.nav — the senior effective NAV, pro-rata to one share
  juniorTrancheSharePriceCollateralAssets: BigInt! # <- claims.collateralAssets of the JUNIOR tranche's share
  juniorTrancheSharePriceLiquidityTrancheAssets: BigInt! # <- claims.lptAssets (INVARIANTLY 0 — the JUNIOR branch never sets it)
  juniorTrancheSharePriceSeniorTrancheShares: BigInt! # <- claims.stShares (INVARIANTLY 0 — likewise)
  juniorTrancheSharePriceNAV: BigInt! # <- claims.nav — the junior effective NAV, pro-rata to one share
  liquidityTrancheSharePriceCollateralAssets: BigInt! # <- claims.collateralAssets (INVARIANTLY 0 — the LIQUIDITY_PROVIDER branch never sets it)
  liquidityTrancheSharePriceLiquidityTrancheAssets: BigInt! # <- claims.lptAssets of the LIQUIDITY tranche's share
  liquidityTrancheSharePriceSeniorTrancheShares: BigInt! # <- claims.stShares (INVARIANTLY 0 — forced by the LPT-only rewrite, NOT by the branch)
  liquidityTrancheSharePriceNAV: BigInt! # <- claims.nav — lptRawNAV pro-rata, NOT an effective NAV (the LPT rewrite substitutes it)
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
  updatedAtTransactionHash: String! # Updated At Transaction Hash
  updatedAtBlockNumber: BigInt! # Updated At Block Number
  updatedAtBlockTimestamp: BigInt! # Updated At Block Timestamp
}

# One immutable snapshot per write of the parent above: entry 0 at market creation,
# then one per TrancheAccountingSynced.
#
# !! HOT / HIGH-CARDINALITY STREAM, for the same reason as
#    DayTrancheAccountingSyncedHistory: the LT's Balancer V3 pool hook holds
#    SYNC_ROLE and syncs on EVERY swap, so this grows at AMM-volume frequency. It
#    is written UNCONDITIONALLY — one row per sync, even when no price moved — so
#    the stream stays dense and 1:1 with the sync stream. Size Neon for it.
# ONE ROW PER (MARKET, BLOCK) — THE LAST PRICE VECTOR THAT BLOCK SETTLED ON.
#
# Collapses exactly like DayTrancheAccountingSyncedHistory, and for the same reason: a
# deposit block emits two syncs (pre-op then post-op) and both re-price the market, so
# without collapsing, one block would leave two near-identical snapshots. The first
# write in a block creates the row; every later write in that block overwrites it.
# The block's FINAL prices win.
#
# !! MUTABLE, AND IT MUST STAY THAT WAY. The id keys on the block number, so a second
#    write in the same block resolves to the SAME id — which on an
#    @entity(immutable: true) is a fatal "entity already exists" at INDEX time that
#    `graph build` cannot catch (§8). CLAUDE.md §8's "never key an id on a block number"
#    is inverted here deliberately: that collision IS the dedupe.
type DayMarketNavHistorical @entity(immutable: false) {
  id: String! # <CHAIN_ID>_<MARKET_ID>_<BLOCK_NUMBER>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID> — also the parent DayMarketNav.id
  blockNumber: BigInt! # Block Number — the key this row collapses on, stored so it is queryable without parsing the id
  # The same 15 price columns as the parent — see its notes for units, provenance,
  # and WHICH SIX of the twelve share-price legs are invariantly zero.
  collateralAssetPriceNAV: BigInt! # Collateral Asset Price NAV
  liquidityTrancheAssetPriceNAV: BigInt! # Liquidity Tranche Asset Price NAV
  quoteAssetPriceNAV: BigInt! # Quote Asset Price NAV (== the BPT's tokenRates[quoteAssetPoolIndex]; see the parent)
  seniorTrancheSharePriceCollateralAssets: BigInt! # <- claims.collateralAssets of the SENIOR tranche's share
  seniorTrancheSharePriceLiquidityTrancheAssets: BigInt! # <- claims.lptAssets (INVARIANTLY 0)
  seniorTrancheSharePriceSeniorTrancheShares: BigInt! # <- claims.stShares (INVARIANTLY 0)
  seniorTrancheSharePriceNAV: BigInt! # <- claims.nav
  juniorTrancheSharePriceCollateralAssets: BigInt! # <- claims.collateralAssets of the JUNIOR tranche's share
  juniorTrancheSharePriceLiquidityTrancheAssets: BigInt! # <- claims.lptAssets (INVARIANTLY 0)
  juniorTrancheSharePriceSeniorTrancheShares: BigInt! # <- claims.stShares (INVARIANTLY 0)
  juniorTrancheSharePriceNAV: BigInt! # <- claims.nav
  liquidityTrancheSharePriceCollateralAssets: BigInt! # <- claims.collateralAssets (INVARIANTLY 0)
  liquidityTrancheSharePriceLiquidityTrancheAssets: BigInt! # <- claims.lptAssets of the LIQUIDITY tranche's share
  liquidityTrancheSharePriceSeniorTrancheShares: BigInt! # <- claims.stShares (INVARIANTLY 0 — the LPT rewrite)
  liquidityTrancheSharePriceNAV: BigInt! # <- claims.nav (lptRawNAV pro-rata, NOT an effective NAV)
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash (the FIRST write in this block)
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
  updatedAtTransactionHash: String! # Updated At Transaction Hash (the write this row settled on)
  updatedAtBlockNumber: BigInt! # Updated At Block Number
  updatedAtBlockTimestamp: BigInt! # Updated At Block Timestamp
  # ^ createdAt* set once, in the `if (!entity)` branch, never re-stamped (§8). One block
  #   can span several transactions, so the two tx hashes genuinely differ when a swap
  #   and a deposit share a block.
}

# xxx MARKETS xxx

# === TRANCHES ===

type DayVaultState @entity(immutable: false) {
  id: String! # <CHAIN_ID>_<VAULT_ADDRESS>
  chainId: BigInt! # Chain ID
  vaultAddress: String! # Vault Address
  majorType: String! # Major Type ("day")
  minorType: String! # Minor Type ("senior", "junior", "liquidity")
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  assetTokenId: String! # Asset Token ID: <CHAIN_ID>_<ASSET_TOKEN_ADDRESS>_<MARKET_ID>_<ROLE>
  # ^ MARKET-SCOPED AND ROLE-TAGGED, matching DayMarketState.collateralTokenId (senior
  #   and junior, which share one collateral token) or liquidityTrancheAssetTokenId
  #   (liquidity). The role comes from this vault's own minorType. THE ONE DEFINITION:
  #   the asset rows on the Global* tables read this column rather than recomputing it.
  #
  #   shareTokenId below is deliberately NOT tagged — a share token has no role among
  #   {collateralAsset, lptAsset, quoteAsset}; it IS this vault. See marketAssetTokenId.
  assetTokenAddress: String! # Asset Token Address
  assetTokenDecimals: Int! # Asset Token Decimals (ERC20.decimals() -> uint8 -> i32; Int! IS i32, assign direct)
  shareTokenId: String! # Share Token ID
  shareTokenAddress: String! # Share Token Address
  shareTokenDecimals: Int! # Share Token Decimals (tranche.decimals() -> uint8 -> i32)
  sharesTotalSupply: BigInt! # Shares Total Supply
  #
  # NO AssetClaims QUADRUPLE HERE, deliberately — this vault carries no claims* and
  # no sharePrice* columns.
  #
  # Both quintuples were dropped in favour of DayMarketNav / DayMarketNavHistorical,
  # which hold all three tranches' share-price claims in ONE row, at ONE instant, and
  # refresh on every accounting sync. The per-vault copies advanced on each vault's own
  # mint/burn cursor, so the senior, junior and liquidity streams were never
  # simultaneous and could not be read as a market-wide price vector — see the note on
  # DayMarketNav.
  #
  # !! CONSEQUENCE, AND IT IS A REAL LOSS: convertToAssets(sharesTotalSupply) — the
  #    claim on the vault's ENTIRE supply — is now recorded NOWHERE, and it is not
  #    exactly recoverable downstream. `sharesTotalSupply * sharePriceNAV / 10 **
  #    shareTokenDecimals` is an approximation only: _scaleAssetClaims floors at
  #    `nav * shares / totalShares` (TrancheClaimsLogic.sol:126), so pricing one share
  #    and multiplying back up loses the per-share truncation, magnified by the supply.
  #    If a consumer ever needs the exact total claim, it comes back as its own field —
  #    it does NOT come back by reviving these columns (§9: add, don't rename).
  #
  # The three-eth_call saving is why refreshVaultClaims became refreshVaultAssetPrice:
  # the two convertToAssets reads per vault per mint/burn had no remaining consumer.
  #
  #
  # NO CONTRACT-SOURCED PRICE AT ALL, deliberately — this entity holds no claims*, no
  # sharePrice* and no assetPriceNAV. Every price the market has lives on DayMarketNav,
  # which captures all three tranches at ONE instant; the per-vault copies could not do
  # that, because each advanced on its own mint/burn cursor.
  #
  # The upshot is that a DayVaultState write costs ZERO eth_calls. applySharesDelta now
  # only adds the supply delta and snapshots — the accumulator is exact at the log index
  # by construction, so there is nothing left to read from chain on a mint or a burn.
  #
  # !! Do NOT reintroduce a price here to "save a join". The reason DayMarketNav exists
  #    is that per-vault prices sampled on per-vault cursors are not comparable across
  #    tranches, and adding one back would put a second, staler answer next to it.
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
  updatedAtTransactionHash: String! # Updated At Transaction Hash
  updatedAtBlockNumber: BigInt! # Updated At Block Number
  updatedAtBlockTimestamp: BigInt! # Updated At Block Timestamp
}

# =============================================================================
# BLOCK-KEYED HISTORY — how every *History / *Historical table is keyed and written.
#
# The *Historical SNAPSHOT tables collapse to ONE ROW PER BLOCK: the first write in a
# block creates the row, every later write in that same block updates it in place, and
# the block's FINAL state survives. That is DayMarketNavHistorical,
# DayVaultStateHistorical, DayPositionStateHistorical and DayFeeStateHistorical, plus
# DayTrancheAccountingSyncedHistory.
#
# THE FIVE RECORD STREAMS DO NOT COLLAPSE — see the exception list at the bottom of
# this block. They keep every event as its own immutable row.
#
# THE SPLIT IS SNAPSHOT vs RECORD, not "state" vs "history": a snapshot is a view of
# something a later write in the same block may legitimately supersede; a record is an
# event that happened, and merging two of them destroys information.
#
# WHY, given §8 says the opposite: §8's "never derive an id from a block number, two
# writes in one block collide" assumes you want every write preserved. Here the
# collision IS the mechanism. The v2 kernel emits TWO sync events per operation
# (pre-op then post-op) and both re-price the market, so without collapsing, one
# deposit would leave two near-identical rows in several tables at once.
#
# THE TWO RULES, both load-bearing:
#   1. EVERY collapsing entity MUST be `@entity(immutable: false)`. A second save on
#      the same id is a fatal "entity already exists" at INDEX time — it passes
#      `graph build` and dies in production.
#   2. createdAt* is the FIRST write in the block, updatedAt* the one the row settled
#      on. A block spans transactions, so the two tx hashes genuinely differ.
#
# ORDER BY blockNumber. Every collapsing table stores it as a column, and it is a
# total order per parent — one row per block, blocks arrive monotonically. There is
# deliberately NO entryIndex on these tables and no cursor on their parents: with the
# id already keyed on the block, a counter carried no information the block number
# did not, and it had to advance on creation but NOT on same-block updates — an
# invariant that fails silently, leaving gaps in an index the schema had promised was
# dense. A consumer wanting a 1,2,3… ordinal derives it:
#   ROW_NUMBER() OVER (PARTITION BY <parent_id> ORDER BY block_number)
#
# !! DELTA COLUMNS ACCUMULATE, THEY DO NOT OVERWRITE. A row that now covers a whole
#    block must still mean what its column comments say. So a per-event DELTA — a fee
#    mint's `shares`, a premium mint's `shares`, a reinvestment's `assets`, an
#    accrual's `yieldShareWAD` — is ADDED to on each write within the block, while
#    SNAPSHOT columns (a state, a cumulative total, a price) are overwritten. That
#    keeps SUM(delta) across rows equal to the lifetime total, which plain
#    last-write-wins would silently break.
#
# !! THE EXCEPTIONS — four streams keyed by entryIndex, not by block:
#
#    DayFixedTermHistory, because it CANNOT be block-keyed. A fixed term OPENS in one
#    block and CLOSES in a later one, so the close-out patches a row opened earlier;
#    under block keying the close would land on a different id and orphan it. It is
#    therefore also the one MUTABLE record stream.
#
#    DayYieldSharesAccruedHistory, because an accrual is an EVENT rather than a view of
#    state. Collapsing it was harmless in practice — the contract emits at most one
#    YieldSharesAccrued per block per market, since _accruePremiumYieldShares returns
#    early on `elapsed == 0` — but it merged nothing while costing a load per write and
#    implying a delta rule that could never fire.
#
#    DayLiquidityPremiumSharesMintedHistory, DayLiquidityPremiumReinvestedHistory and
#    DayLiquidityPremiumReinvestmentFailedHistory, because EVERY EVENT IS WANTED. A
#    block can carry several premium mints or several reinvestment attempts, and each
#    is a distinct economic act with its own amounts — collapsing them would fuse a
#    failed attempt and a successful retry into one row and lose the sequence. They
#    are IMMUTABLE and written exactly once, which is what makes the delta-accumulation
#    rule above irrelevant to them: `shares` and `assets` are the event's own values,
#    never a running sum.
#
#    All five are cursored by DayMarketState.count*Entries — see "ENTRY INDEX CURSOR".
# =============================================================================

# =============================================================================
# ENTRY INDEX CURSOR — applies to the FIVE record streams, and to nothing else.
#
#   DayFixedTermHistory                          (MUTABLE — the close patches the row)
#   DayYieldSharesAccruedHistory                 (immutable)
#   DayLiquidityPremiumSharesMintedHistory       (immutable)
#   DayLiquidityPremiumReinvestedHistory         (immutable)
#   DayLiquidityPremiumReinvestmentFailedHistory (immutable)
#
# Each keeps EVERY event as its own row, so each needs a per-write discriminator in
# its id: <CHAIN_ID>_<MARKET_ID>_<ENTRY_INDEX>. The *Historical snapshot tables are
# keyed and ordered by block number instead and carry no counter — see "BLOCK-KEYED
# HISTORY" above.
#
# Every cursor here is a COUNT, not a last-index: a market legitimately has zero fixed
# terms (or zero premium mints) forever, so a non-null last-index has no truthful
# initial value — 0 would falsely assert one entry exists.
#
#   const idx = market.countXEntries;   // this IS the next entryIndex
#   ... build the id from idx, set entity.entryIndex = idx ...
#   market.countXEntries = idx.plus(BigInt.fromI32(1));
#
# Total == countXEntries; last == countXEntries - 1, readable ONLY when > 0.
# Use-THEN-increment, 0-based, dense.
#
# DO NOT reintroduce this shape on the *Historical snapshot tables. It once existed
# there and was removed deliberately — see the ordering note in "BLOCK-KEYED HISTORY"
# above for what it cost and what replaced it. The distinction is SNAPSHOT vs RECORD:
# a snapshot is a view of state that a block can legitimately overwrite, a record is
# an event that must never be merged with another.
# =============================================================================

# ONE ROW PER BLOCK — this stream collapses like every other *History/*Historical table.
# The first write in a block creates the row; later writes in that same block update it
# in place. MUTABLE for exactly that reason: the id keys on
# the block, so a second write resolves to the same id, which on an immutable entity is
# a fatal "entity already exists" at INDEX time (§8). See "BLOCK-KEYED HISTORY" above.
type DayVaultStateHistorical @entity(immutable: false) {
  id: String! # <CHAIN_ID>_<VAULT_ADDRESS>_<BLOCK_NUMBER>
  chainId: BigInt! # Chain ID
  vaultAddress: String! # Vault Address
  vaultId: String! # Vault ID
  blockNumber: BigInt! # Block Number — the key this row collapses on, stored so it is queryable without parsing the id
  majorType: String! # Major Type ("day")
  minorType: String! # Minor Type ("senior", "junior", "liquidity")
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  sharesTotalSupply: BigInt! # Shares Total Supply
  # No claims* / sharePrice* / assetPriceNAV here either — mirrors the parent, which
  # now carries no price at all. See its note. (This entity could not have kept
  # assetPriceNAV alone in any case: it has no assetTokenDecimals of its own and is
  # forbidden from re-calling the Kernel, so it only ever copied the parent's value.)
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash (the FIRST write in this block)
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
  updatedAtTransactionHash: String! # Updated At Transaction Hash (the write this row settled on)
  updatedAtBlockNumber: BigInt! # Updated At Block Number
  updatedAtBlockTimestamp: BigInt! # Updated At Block Timestamp
}

# xxx TRANCHES xxx

# === RECORDS ===
#
# Six event-driven, market-keyed streams. FIVE of them keep every event as its own row,
# cursored by a DayMarketState.count*Entries counter; only
# DayTrancheAccountingSyncedHistory collapses to one row per (market, block), because
# both sync events re-price the same market and a deposit block legitimately produces two
# of them. See "ENTRY INDEX CURSOR" and "BLOCK-KEYED HISTORY" above.

# THE ONE MUTABLE RECORD STREAM. Three separate events write one row, so
# immutable: true would be a fatal "entity already exists" at index time (§8):
#   1. FixedTermCommenced(uint32)                     -> creates the row
#   2. FixedTermEnded()                               -> sets endBlockTimestamp
#   3. JuniorTrancheImpermanentLossReset(uint256)
#        -> patches juniorTrancheImpermanentLossNAV. Same tx as (2),
#           later log index — handlers fire in log order, so (2) cannot see it.
#
# !! FixedTermEnded() has an EMPTY payload — it carries no term identifier. The
#    only way to resolve WHICH term ended is to load the open row at
#    (countFixedTermEntries - 1), guarded on countFixedTermEntries > 0. Never
#    derive an entry index from block number or timestamp (§8).
#
# !! Events (1) and (2) are on RoycoDayAccountant, whose address is NOT the
#    marketId (§6). Resolve accountant -> market via DayAccountantMarketMap first
#    (resolveMarketFromAccountant), at zero eth_calls.
#
# !! CLOSING A TERM IS A UNION OF TWO EVENTS, NOT ONE. setFixedTermDuration(0)
#    force-writes lastMarketState = PERPETUAL and deletes fixedTermEndTimestamp,
#    but emits NO FixedTermEnded — `withSyncedAccounting` syncs BEFORE the body,
#    while the old non-zero duration still holds, so the pre-body sync need not
#    transition either. Closing on FixedTermEnded alone silently leaves
#    endBlockTimestamp == 0 forever on a provably-perpetual market. So ALSO close
#    on FixedTermDurationUpdated(uint24) when fixedTermDurationSeconds == 0.
#    Both can fire in ONE tx (natural expiry + a duration write), so guard every
#    close on `endBlockTimestamp == 0` before writing. initialize() also emits
#    FixedTermDurationUpdated, so no-op on a null lookup rather than creating.
type DayFixedTermHistory @entity(immutable: false) {
  id: String! # <CHAIN_ID>_<MARKET_ID>_<ENTRY_INDEX>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  entryIndex: BigInt! # Entry Index (cursor: DayMarketState.countFixedTermEntries)
  startBlockTimestamp: BigInt! # Start Block Timestamp (event.block.timestamp of FixedTermCommenced)
  scheduledEndBlockTimestamp: BigInt! # Scheduled End Block Timestamp <- ABI: FixedTermCommenced.fixedTermEndTimestamp (uint32 -> BigInt, direct — NOT uint24, no BigInt.fromI32)
  # ^ The CONTRACT-SCHEDULED end, distinct in kind from endBlockTimestamp below (the
  #   ACTUAL end). DayMarketState.fixedTermEndTimestamp holds the same number but is
  #   LIVE state — it is deleted on term end and overwritten by each new term, so
  #   scheduled-vs-actual for a CONCLUDED term is unanswerable without this per-term
  #   copy. Do not substitute one for the other.
  endBlockTimestamp: BigInt! # End Block Timestamp (ACTUAL end; if not ended, it's 0)
  duration: BigInt # Duration in SECONDS = endBlockTimestamp - startBlockTimestamp. NULL while the term is still running.
  # ^ THE ONE NULLABLE FIELD IN THIS SCHEMA (note the missing `!`). Every other column
  #   is non-null with a sentinel; this one is genuinely absent until there is an answer,
  #   which is the honest encoding: a running term has no duration, and 0 would be a lie
  #   (it is also a legal REAL duration — a term that opens and closes in one block).
  #   Written exactly once, in closeOpenFixedTerm, in the same write as endBlockTimestamp.
  #
  # !! endBlockTimestamp REMAINS the open/closed key — do NOT re-point the guards at
  #    `duration == null`. closeOpenFixedTerm and recordFixedTermCoverageLoss both branch
  #    on `endBlockTimestamp.isZero()`, and that field is non-null and frozen (§9). The
  #    two encodings agree by construction because one write sets both; they are not
  #    independent signals, and duration is the DERIVED one.
  #
  #    In Neon this is a nullable bigint, so `WHERE duration IS NULL` selects live terms —
  #    cleaner than `endBlockTimestamp = 0`, and the intended read path for consumers.
  #    Aggregates behave correctly too: AVG/MIN/MAX skip NULLs, whereas the 0 sentinel
  #    would silently drag an average of term lengths toward zero.
  juniorTrancheImpermanentLossNAV: BigInt! # Junior Impermanent Loss NAV (0 if not ended, or no loss) <- ABI: JuniorTrancheImpermanentLossReset.jtImpermanentLossErased
  # ^ NON-NULL, seeded to 0 at FixedTermCommenced — deliberately NOT nullable like
  #   `duration` above. A real erase is always > 0 (the handler returns early on a zero
  #   erase), so 0 unambiguously means "no loss recorded for this term". It does NOT
  #   distinguish a running term from one that expired cleanly — pair it with `duration`
  #   for that: `duration IS NOT NULL AND juniorTrancheImpermanentLossNAV = 0` is the
  #   clean expiry.
  #
  # ^ NOT previewSyncTrancheAccountingFor().state.jtImpermanentLoss and NOT
  #   getState().lastJTImpermanentLoss — BOTH are provably ZERO by the instant
  #   FixedTermEnded fires: the Accountant erases into a local and zeroes storage
  #   BEFORE marshalling state. The pre-erase value survives ONLY in the Reset event.
  #
  # !! HANDLER GUARD — a blind patch CORRUPTS rows, and so does the obvious guard.
  #    An erase does NOT imply a term ended: the erase branch has four disjuncts and
  #    only one is "the fixed term elapsed"; the rest (duration permanently 0,
  #    coverage past the liquidation threshold, JT wiped out) fire on markets that
  #    are ALREADY perpetual. The two emit sites also differ — the sync site is
  #    guarded by `!= ZERO_NAV_UNITS`, the setFixedTermDuration(0) site is NOT.
  #    Three shapes reach the handler:
  #      A) sync path, term ended  -> FixedTermEnded fired at a LOWER log index, so
  #                                   the row is CLOSED, IN THIS TX.        -> patch
  #      B) setFixedTermDuration(0) on a LIVE term -> the body emits the Reset with
  #                                   a real loss BEFORE its own
  #                                   FixedTermDurationUpdated(0), so the row is
  #                                   still OPEN.                           -> patch
  #      C) incidental erase, market already perpetual -> the last row closed in an
  #                                   EARLIER tx.                           -> skip
  #    So: patch iff the row is OPEN or was CLOSED IN THIS TX.
  #      if (erased.isZero()) return;                       // unguarded config site
  #      if (!entry.endBlockTimestamp.isZero() &&
  #          entry.updatedAtTransactionHash != thisTx) return;
  #    Case B is why "the row must be closed" is WRONG — it silently drops the loss
  #    on every mid-term setFixedTermDuration(0). See recordFixedTermCoverageLoss.
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
  updatedAtTransactionHash: String! # Updated At Transaction Hash
  updatedAtBlockNumber: BigInt! # Updated At Block Number
  updatedAtBlockTimestamp: BigInt! # Updated At Block Timestamp
  # ^ createdAt* set exactly once in the `if (!entity)` branch — never re-stamp it on
  #   the close-out patches (§8).
}

# <- ABI: RoycoDayAccountant.YieldSharesAccrued(uint256 jtYieldShareWAD, uint256 twJTYieldShareAccruedWAD, uint256 lptYieldShareWAD, uint256 twLPTYieldShareAccruedWAD)
#
# ONE TABLE, ONE ROW PER ACCRUAL. v1 had two entities and two cursors, fed by two
# separate events (JuniorTrancheYieldShareAccrued + LiquidityTrancheYieldShareAccrued)
# that were always emitted together at adjacent log indices. v2 merged them into a
# single YieldSharesAccrued carrying all four values, so the two accruals are now
# genuinely one atomic event and get one row — no more rows that can never occur
# independently, and no more chance of the two cursors drifting apart.
#
# The accountant address is NOT the marketId — resolve via DayAccountantMarketMap (§6).
# The map replaces a repeated getState().kernel call at zero eth_calls.
#
# ONE ROW PER EVENT — this stream does NOT collapse. Every accrual keeps its own
# immutable row, cursored by DayMarketState.countYieldSharesAccruedEntries.
#
# Block keying would have been harmless here and is still wrong to use: the contract
# emits AT MOST ONE YieldSharesAccrued per block per market, because
# _accruePremiumYieldShares returns early on `elapsed == 0` and stamps
# lastYieldShareAccrualTimestamp before its emit, so a second sync in the same block
# cannot reach it. Collapsing therefore merged nothing — it only cost a load per write
# and invited a delta-accumulation rule that could never fire. An accrual is an EVENT,
# not a snapshot of state a block may overwrite, so it belongs on the record side of
# that split. See "ENTRY INDEX CURSOR" above.
type DayYieldSharesAccruedHistory @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<MARKET_ID>_<ENTRY_INDEX>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  entryIndex: BigInt! # Entry Index (cursor: DayMarketState.countYieldSharesAccruedEntries)
  juniorTrancheYieldShareWAD: BigInt! # Junior Tranche Yield Share WAD <- ABI: jtYieldShareWAD
  juniorTrancheTimeWeightedYieldShareAccruedWAD: BigInt! # <- ABI: twJTYieldShareAccruedWAD
  liquidityTrancheYieldShareWAD: BigInt! # Liquidity Tranche Yield Share WAD <- ABI: lptYieldShareWAD
  liquidityTrancheTimeWeightedYieldShareAccruedWAD: BigInt! # <- ABI: twLPTYieldShareAccruedWAD
  # ^ NEITHER timeWeighted* IS MONOTONIC. Each is the accumulator AFTER its increment,
  #   and both are zeroed whenever premiums are paid out of ST yield. The series is a
  #   SAWTOOTH that resets per premium payment, NOT a lifetime cumulative — a negative
  #   delta between consecutive rows (ORDER BY entryIndex) IS the reset marker, not a
  #   data error.
  #   They accrue only since the last premium payment;
  #   DayMarketState.lastPremiumPaymentTimestamp holds that boundary for CURRENT state
  #   but is deliberately not snapshotted here.
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
}

# <- ABI: RoycoDayKernel.PreOpTrancheAccountingSynced((uint8,uint256 x11,uint32,uint256,uint256,uint256) resultingState)
#         RoycoDayKernel.PostOpTrancheAccountingSynced(uint8 op, (…same 16-field state…) resultingState)
#
# ONE ROW PER (MARKET, BLOCK) — THE LATEST SYNC THAT BLOCK SETTLED ON.
#
# BOTH kernel sync events feed this table, and they COLLAPSE rather than accumulate:
#   - the first sync in a block CREATES the row
#   - every later sync in that SAME block OVERWRITES it in place
# So a swap-only block leaves a `preOp` row; a deposit block leaves a `postOp` row,
# because the post-op fires second and wins. `syncType` records which one the row
# actually settled on, and `operation` is non-null only when that was a post-op.
#
# !! THIS IS THE ONE ENTITY DELIBERATELY KEYED BY BLOCK NUMBER, and the one place
#    CLAUDE.md §8's "never derive an id from a block number — two writes in one block
#    collide" is INVERTED ON PURPOSE. That collision IS the dedupe: it is what makes the
#    second sync in a block find and update the first instead of appending. Because of
#    that this entity MUST stay `immutable: false` — an immutable entity re-saved on the
#    same id is a fatal "entity already exists" at INDEX time, which `graph build`
#    cannot catch (§8). Do not "restore" immutability here.
#
# !! ONE ROW PER BLOCK-WITH-A-SYNC, not per sync event. A block with four syncs leaves
#    ONE row, so COUNT(*) here is a count of blocks, never of events. Order by
#    `blockNumber`; there is no entryIndex on this table.
#
# !! ON THE KERNEL, NOT THE ACCOUNTANT. The kernel address IS the marketId (§6), so both
#    handlers resolve the market directly — no accountant -> market hop at all, which is
#    what v1 paid an eth_call for on the hottest path in the subgraph.
#
# !! THE PLACEHOLDER-ZERO PROBLEM IS GONE. In v1 the single sync event carried
#    `lptRawNAV: ZERO_NAV_UNITS` and `liquidityUtilizationWAD: 0` as placeholders, so
#    those two columns were permanently zero. Both events now emit AFTER
#    _commitLPTRawNAV, which refreshes both members in the state packet in place, so
#    every column below carries a real value.
#
# Pre-op fires on EVERY sync — the liquidity venue's swap hook, oracle updates,
# syncTrancheAccounting, reinvestLiquidityPremium, and the first half of every deposit
# and redemption. Post-op fires only on the six deposit/redeem operations. Indexing
# both is what keeps AMM- and oracle-driven price movement in this table.
type DayTrancheAccountingSyncedHistory @entity(immutable: false) {
  id: String! # <CHAIN_ID>_<MARKET_ID>_<BLOCK_NUMBER>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  blockNumber: BigInt! # Block Number — the key this row collapses on, stored so it is queryable without parsing the id
  syncType: String! # Sync Type ("preOp", "postOp") — which event this row last settled on
  operation: String # Operation ("stDeposit" … "lptRedeem"). NULL while the row is a preOp row.
  # ^ NULLABLE ON PURPOSE, and only the second such field in this schema (see
  #   DayFixedTermHistory.duration). A pre-op sync happens BEFORE any operation is
  #   chosen, so there is no operation to record — and "" or a "none" sentinel would
  #   both be lies, since every enum member is a real operation. `syncType == "preOp"`
  #   and `operation IS NULL` always agree; the two are one fact stored twice, one
  #   queryable per Neon idiom.
  #   Enum order is the on-chain `Operation` declaration order
  #   (contracts/libraries/Types.sol): 0 stDeposit, 1 stRedeem, 2 jtDeposit, 3 jtRedeem,
  #   4 lptDeposit, 5 lptRedeem, 6 lptMultiAssetDeposit, 7 lptMultiAssetRedeem.
  #   The ABI carries the enum's type but not its member names, so this ordering comes
  #   from source. An out-of-range ordinal surfaces as "unknown".
  # --- The full SyncedAccountingState, in ABI order. ---
  marketState: String! # Market State ("perpetual" -> 0, "fixed" -> 1) <- ABI: resultingState.marketState (uint8 enum -> i32)
  # ^ !! LIVE state at sync time — NOT the same field as DayMarketState.marketState.
  #      DayMarketState stores getState().lastMarketState (the STORED value); this row
  #      stores the sync's own state.marketState (the LIVE value). The two disagree
  #      between syncs, and that divergence is precisely why capturing the live one
  #      here is useful — and why it must never be copied onto DayMarketState (§6).
  #      Enum order is PERPETUAL, FIXED_TERM — 0 is perpetual, which reads backwards.
  #      Do not "correct" it.
  collateralNAV: BigInt! # Collateral NAV <- ABI: collateralNAV
  liquidityTrancheRawNAV: BigInt! # Liquidity Tranche Raw NAV <- ABI: lptRawNAV
  seniorTrancheEffectiveNAV: BigInt! # Senior Tranche Effective NAV <- ABI: stEffectiveNAV
  juniorTrancheEffectiveNAV: BigInt! # Junior Tranche Effective NAV <- ABI: jtEffectiveNAV
  juniorTrancheImpermanentLoss: BigInt! # Junior Tranche Impermanent Loss (LIVE, point-in-time) <- ABI: jtImpermanentLoss
  liquidityTrancheLiquidityPremium: BigInt! # Liquidity Tranche Liquidity Premium <- ABI: lptLiquidityPremium
  # The three PER-SYNC protocol-fee AMOUNTS — NAV_UNIT amounts taken on THIS sync.
  # NOT the uint64 RATES on DayMarketState.*ProtocolFeeWAD (from getState()): different
  # type, different unit, one word apart (§6/§7). They have no home on DayMarketState
  # and are dropped there; this table is the only place they are recorded.
  #
  # !! A COLLAPSED ROW REPORTS THE LAST SYNC'S FEES, NOT THE BLOCK'S TOTAL. These are
  #    per-sync deltas, and an overwrite replaces rather than adds. On a deposit block
  #    the post-op values win — and post-op takes no fees at all, so they are zero there
  #    by construction. Do NOT SUM this column expecting protocol revenue; it is a
  #    sample of the surviving sync, not an accumulator.
  seniorTrancheProtocolFee: BigInt! # Senior Tranche Protocol Fee (NAV_UNIT amount, this sync) <- ABI: stProtocolFee
  juniorTrancheProtocolFee: BigInt! # Junior Tranche Protocol Fee (NAV_UNIT amount, this sync) <- ABI: jtProtocolFee
  liquidityTrancheProtocolFee: BigInt! # Liquidity Tranche Protocol Fee (NAV_UNIT amount, this sync) <- ABI: lptProtocolFee
  coverageUtilizationWAD: BigInt! # Coverage Utilization WAD <- ABI: coverageUtilizationWAD
  liquidityUtilizationWAD: BigInt! # Liquidity Utilization WAD <- ABI: liquidityUtilizationWAD
  fixedTermEndTimestamp: BigInt! # Fixed Term End Timestamp (LIVE) <- ABI: fixedTermEndTimestamp (uint32 -> BigInt, direct)
  minCoverageWAD: BigInt! # Min Coverage WAD (LIVE, recomputed — NOT getState()'s stored one, §6) <- ABI: minCoverageWAD
  coverageLiquidationUtilizationWAD: BigInt! # Coverage Liquidation Utilization WAD (LIVE) <- ABI: coverageLiquidationUtilizationWAD
  minLiquidityWAD: BigInt! # Min Liquidity WAD (LIVE — NOT getState()'s stored one, §6) <- ABI: minLiquidityWAD
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash (the FIRST sync in this block)
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
  updatedAtTransactionHash: String! # Updated At Transaction Hash (the sync this row settled on)
  updatedAtBlockNumber: BigInt! # Updated At Block Number
  updatedAtBlockTimestamp: BigInt! # Updated At Block Timestamp
  # ^ createdAt* is set once, in the `if (!entity)` branch, and never re-stamped (§8).
  #   One block can span several transactions, so createdAtTransactionHash and
  #   updatedAtTransactionHash genuinely differ when a swap and a deposit share a block.
}


# <- ABI: RoycoSeniorTranche.LiquidityPremiumSharesMinted(indexed address holder, uint256 mintedLiquidityPremiumShares, uint256 totalTrancheShares)
#
# !! event.address is the SENIOR TRANCHE, not the kernel. Resolve marketId via
#    loading this tranche's own DayVaultState and reading its marketId — no eth_call per
#    event.
#    The market-keyed id is SAFE: exactly one senior tranche per market.
type DayLiquidityPremiumSharesMintedHistory @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<MARKET_ID>_<ENTRY_INDEX>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  entryIndex: BigInt! # Entry Index (cursor: DayMarketState.countLiquidityPremiumSharesMintedEntries)
  vaultAddress: String! # Vault Address (the SENIOR TRANCHE — event.address)
  vaultId: String! # Vault ID
  accountAddress: String! # Account Address <- ABI: LiquidityPremiumSharesMinted.holder
  # ^ INVARIANTLY THE KERNEL, i.e. always == marketId. Never an end user, never an LP:
  #   the caller passes address(this) from inside the kernel, and
  #   RoycoSeniorTranche.mintLiquidityPremiumShares is `onlyKernel` with no other
  #   minter — enforced at the contract level, not merely observed. Kept for shape
  #   symmetry with the other fee/position entities; it is a constant column.
  shares: BigInt! # Shares <- ABI: mintedLiquidityPremiumShares
  sharesTotalSupply: BigInt! # Shares Total Supply <- ABI: totalTrancheShares (the SENIOR tranche total supply POST-mint)
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
}

# <- ABI: RoycoDayKernel.LiquidityPremiumReinvested(uint256 stSharesReinvested, uint256 ltAssetsMinted)
# Kernel handlers resolve the market directly — the kernel address IS the marketId (§6).
type DayLiquidityPremiumReinvestedHistory @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<MARKET_ID>_<ENTRY_INDEX>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  entryIndex: BigInt! # Entry Index (cursor: DayMarketState.countLiquidityPremiumReinvestedEntries)
  shares: BigInt! # Shares <- ABI: stSharesReinvested (senior shares ACTUALLY reinvested)
  assets: BigInt! # Assets <- ABI: ltAssetsMinted (LT assets ACTUALLY minted)
  # ^ Both are REALISED amounts. The identically-named fields on
  #   DayLiquidityPremiumReinvestmentFailedHistory are an ATTEMPT and a BOUND — do not
  #   union or sum the two tables' `shares`/`assets` columns.
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
}

# <- ABI: RoycoDayKernel.LiquidityPremiumReinvestmentFailed(uint256 stSharesToReinvest, uint256 minLTAssetsOut, bytes revertData)
# Kernel handlers resolve the market directly — the kernel address IS the marketId (§6).
type DayLiquidityPremiumReinvestmentFailedHistory @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<MARKET_ID>_<ENTRY_INDEX>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  entryIndex: BigInt! # Entry Index (cursor: DayMarketState.countLiquidityPremiumReinvestmentFailedEntries)
  shares: BigInt! # Shares <- ABI: stSharesToReinvest (senior shares the reinvestment ATTEMPTED; never moved)
  assets: BigInt! # Assets <- ABI: minLTAssetsOut (a SLIPPAGE BOUND, never minted)
  # ^ !! Same field NAMES as DayLiquidityPremiumReinvestedHistory, DIFFERENT MEANINGS.
  #      There: realised amounts. Here: an attempt and a floor. Nothing was minted.
  revertData: String! # Revert Data <- ABI: revertData (bytes -> Bytes -> .toHexString(), §4)
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
}

# <- ABI: RoycoLiquidityProviderTranche.MultiAssetDeposit(indexed address caller, indexed address receiver, uint256 collateralAssets, uint256 quoteAssets, uint256 lptAssetsMinted, uint256 shares)
#
# LIQUIDITY-TRANCHE-ONLY event — only RoycoLiquidityProviderTranche declares depositMultiAsset;
# the senior/junior tranches never emit it. One firing == one multi-asset LP deposit.
#
# !! An ACTIVITY table: the id is <CHAIN_ID>_<TX_HASH>_<LOG_INDEX> — one row per event log,
#    like GlobalTokenActivity/GlobalTokenTransfer. No DayMarketState cursor and no
#    entryIndex or cursor: the (tx, logIndex) pair is already unique.
#
# !! event.address is the LIQUIDITY TRANCHE, not the kernel (§6). marketId/marketRefId are
#    still populated (for market-scoped joins) by loading this tranche's own DayVaultState
#    and reading its marketId — cheaper than an eth_call to LiquidityTranche.kernel().
#
# !! UNITS/DIRECTION: the three asset legs below are the RAW amounts pulled IN from the
#    depositor (asset-token units), NOT tranche-unit claims. Do NOT equate them with the
#    redeem stream's claims* legs, which are settled TRANCHE_UNIT claims paid OUT.
#    Prefer this event over previewDepositMultiAsset — it carries the exact numbers the
#    preview returns, for free, as the post-state at this log index (§5).
type DayMultiAssetDepositActivity @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<TRANSACTION_HASH>_<LOG_INDEX>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  vaultAddress: String! # Vault Address (the LIQUIDITY TRANCHE — event.address)
  vaultId: String! # Vault ID
  accountAddress: String! # Account Address <- ABI: MultiAssetDeposit.receiver
  # ^ The SHARE-SIDE party: who the LT shares are minted to. Chosen over `caller` so this
  #   column keeps DayPositionState.accountAddress semantics ("this account's balance of
  #   THIS vault's share token") and joins straight to the LP's LT position.
  callerAddress: String! # Caller Address <- ABI: MultiAssetDeposit.caller
  # ^ msg.sender, the LP initiator whose ST+quote legs are pulled to the kernel
  #   (RoycoLiquidityProviderTranche.sol:60-61,75). MAY be a router/zap distinct from receiver,
  #   and is not recoverable from the Global* token tables (a mid-call contract is not
  #   tx.origin) — this row is the sole on-subgraph record of the initiator.
  collateralAssets: BigInt! # Collateral Assets <- ABI: collateralAssets (raw COLLATERAL leg pulled IN; asset-token units)
  quoteAssets: BigInt! # Quote Assets <- ABI: quoteAssets (raw venue QUOTE_ASSET leg pulled IN — the pool's non-senior constituent; NOTE the same column name is paid OUT on redeem)
  liquidityTrancheAssetsMinted: BigInt! # Liquidity Tranche Assets Minted <- ABI: lptAssetsMinted
  shares: BigInt! # Shares <- ABI: shares (LT shares MINTED to receiver)
  # ^ These four are a FLAT amount tuple, NOT an AssetClaims quintuple — no claims* prefix
  #   (contrast DayMultiAssetRedeemActivity, whose stClaims IS one). The ST/quote/LT
  #   underlying ERC20s are unindexed here, so this row is the sole on-subgraph record of
  #   the asset legs; only `shares` also appears in Global* (the LT Transfer mint at a
  #   lower log index). The handler writes ONLY this activity row — it
  #   must NOT re-book supply/position (owned by that Transfer); the two are joinable by
  #   transaction hash but NOT summable. No sharesTotalSupply column: the event
  #   carries no supply arg, and an eth_call totalSupply() would double-count against the
  #   Transfer handler's supply accounting (royco-factory.ts:284-292 trap).
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
}

# <- ABI: RoycoLiquidityProviderTranche.MultiAssetRedeem(indexed address caller, indexed address receiver, indexed address owner, uint256 shares, (uint256 collateralAssets, uint256 lptAssets, uint256 stShares, uint256 nav) stClaims, uint256 quoteAssets)
#
# LIQUIDITY-TRANCHE-ONLY event. NOTE stClaims sits at index 4, AFTER `shares` — unlike
# Redeem, where the claims struct is at index 2 (§6).
#
# !! An ACTIVITY table: the id is <CHAIN_ID>_<TX_HASH>_<LOG_INDEX> — one row per event log,
#    like GlobalTokenActivity. No DayMarketState cursor and no entryIndex — and unlike
#    the collapsing tables, no block keying either: every event keeps its own row.
#
# !! event.address is the LIQUIDITY TRANCHE, not the kernel (§6). marketId/marketRefId are
#    populated (for market-scoped joins) by loading this tranche's own DayVaultState and
#    reading its marketId — cheaper than an eth_call to LiquidityTranche.kernel().
#
# !! THREE distinct parties — caller, receiver and owner can all differ:
#      owner    = whose LT shares are BURNED (_burn(owner, shares))      -> accountAddress
#      receiver = who RECEIVES the ST/JT underlying + quote assets        -> receiverAddress
#      caller   = msg.sender; spends owner's LT allowance when != owner   -> callerAddress
type DayMultiAssetRedeemActivity @entity(immutable: true) {
  id: String! # <CHAIN_ID>_<TRANSACTION_HASH>_<LOG_INDEX>
  chainId: BigInt! # Chain ID
  marketId: String! # Market ID: <KERNEL_ADDRESS>
  marketRefId: String! # Market Reference ID: <CHAIN_ID>_<MARKET_ID>
  vaultAddress: String! # Vault Address (the LIQUIDITY TRANCHE — event.address)
  vaultId: String! # Vault ID
  accountAddress: String! # Account Address <- ABI: MultiAssetRedeem.owner
  # ^ The SHARE-SIDE party: whose LT shares are burned (_burn(owner, shares),
  #   RoycoLiquidityProviderTranche.sol:105). Chosen over receiver/caller so this column keeps
  #   DayPositionState.accountAddress semantics and joins straight to the LP's LT
  #   position. Do NOT naively JOIN to DayMultiAssetDepositActivity.accountAddress: there
  #   it is the mint RECEIVER, here the burn OWNER — both share-side, different role.
  callerAddress: String! # Caller Address <- ABI: MultiAssetRedeem.caller
  # ^ msg.sender. When caller != owner it spends owner's LT allowance
  #   (_spendAllowance(owner, msg.sender, shares), RoycoLiquidityProviderTranche.sol:97-99). MAY
  #   be a router/zap; only on-subgraph record of the initiator.
  receiverAddress: String! # Receiver Address <- ABI: MultiAssetRedeem.receiver
  # ^ Who the withdrawn ST/JT underlying + quoteAssets are PAID TO. Can differ from owner
  #   on a delegated/routed redeem. Those ST_ASSET/JT_ASSET/QUOTE_ASSET ERC20s are
  #   unindexed here, so this event is the ONLY on-subgraph record of the asset recipient.
  shares: BigInt! # Shares <- ABI: shares (LT shares BURNED from owner; always non-zero, require(_shares != 0))
  # ^ The handler writes ONLY this activity row — it must NOT re-book
  #   supply/position (owned by the LT burn Transfer at a lower log index). Joinable to
  #   Global* by transaction hash but NOT summable. No sharesTotalSupply column:
  #   the event carries no supply arg.
  #
  # --- The AssetClaims quintuple carried by stClaims. See the "ASSET CLAIMS" block
  #     above for the field mapping and the claims* prefix rationale.
  #
  # !! PROVENANCE DIFFERS from every other claims* quintuple in this schema, and it is
  #    NOT the DayVaultState LPT convertToAssets asymmetry (stShares->0, nav->lptRawNAV) —
  #    do NOT copy that note here. stClaims is the kernel's SENIOR-tranche claim:
  #    _deriveTrancheAssetClaims(SENIOR, state), scaled by stSharesToRedeem/totalSTShares,
  #    then the ST self-liquidation bonus. Verified in contracts/:
  #      - claimsSeniorTrancheShares AND claimsLiquidityTrancheAssets are INVARIANTLY 0.
  #        The SENIOR branch of _deriveTrancheAssetClaims sets ONLY nav +
  #        collateralAssets and never the two LPT-only fields; scaling and the bonus
  #        preserve the zeros. Same zero VALUE as a liquidity row, DIFFERENT cause (a
  #        senior claim, not the convertToAssets rewrite).
  #      - claimsNAV is a SENIOR effective-NAV figure, NOT lptRawNAV.
  #    Non-zero legs: claimsCollateralAssets and claimsNAV — just TWO in v2, because the
  #    separate ST and JT asset legs merged into one collateral leg. Any self-liquidation
  #    bonus drawn from JT now arrives inside that same collateral figure rather than as
  #    its own column. UNITS: these are settled TRANCHE_UNIT claims paid OUT — do NOT
  #    equate with the deposit stream's raw pulled-in asset legs.
  claimsCollateralAssets: BigInt! # Claims Collateral Assets <- ABI: stClaims.collateralAssets (collateral underlying settled to receiver, incl. any self-liquidation bonus)
  claimsLiquidityTrancheAssets: BigInt! # Claims Liquidity Tranche Assets <- ABI: stClaims.lptAssets (INVARIANTLY 0 — LPT-only field; a SENIOR claim never sets it)
  claimsSeniorTrancheShares: BigInt! # Claims Senior Tranche Shares <- ABI: stClaims.stShares (INVARIANTLY 0 — LPT-only field; a SENIOR claim never sets it; NOT the LPT convertToAssets asymmetry)
  claimsNAV: BigInt! # Claims NAV <- ABI: stClaims.nav — the redeemer's PRO-RATA slice of the senior effective NAV (scaled by stSharesToRedeem/totalSTShares) PLUS any ST self-liquidation bonus NAV; NOT lptRawNAV, and NOT the market-level state.stEffectiveNAV
  quoteAssets: BigInt! # Quote Assets <- ABI: quoteAssets (venue QUOTE_ASSET paid OUT to receiver; 0 when the user's LPT asset claim is 0 and venue removal is skipped; NOTE the same column name is pulled IN on deposit)
  # => general data
  createdAtTransactionHash: String! # Created At Transaction Hash
  createdAtBlockNumber: BigInt! # Created At Block Number
  createdAtBlockTimestamp: BigInt! # Created At Block Timestamp
}

